      '<span>ครบถ้วน ' + s.coverage.covered + '/' + s.coverage.required + ' ข้อ</span><span class="wh-num">' + esc(scoreText) + '</span></div>' +
      '<div class="wh-actions">' + (d.permissions.edit ? '<button class="btn btn-primary only-wide" id="btn-quick">' + App.icon('camera') + 'จดเร็ว</button>' : '') + (d.standard.red_lines.length ? '<button class="btn btn-ghost" id="btn-rl">' + App.icon('flag') + 'Red Line' + (rlCount ? ' (' + rlCount + ')' : '') + '</button>' : '') +
      '<a class="btn btn-ghost" href="#/audit/' + a.id + '/summary">' + App.icon('audit') + 'สรุปคะแนน</a>' +
      (function () { var n = App.QC.nextTeamHref(a); return n ? '<a class="btn btn-ghost" href="' + n.href + '" title="เปิดรอบตรวจใหม่ของ ' + esc(n.name) + ' ด้วยค่าเดิม">' + App.icon('chevr') + 'ตรวจทีมถัดไป</a>' : ''; })() + '</div>';
    var b = App.$('#btn-rl'); if (b) b.onclick = function () { App.redLineDialog(); };
    var q = App.$('#btn-quick'); if (q) q.onclick = App.QC.capture;
    App.$('#ws-hist').innerHTML = App.QC.historyBanner();
    var hf = App.$('#hist-filter'); if (hf) hf.onclick = function () { W.filter = 'prev'; W.stop = null; renderRoute(); renderList(); var f = visibleItems()[0]; if (f) select(f.id); App.toast('แสดงเฉพาะข้อที่เคยพบปัญหาครั้งก่อน', 'info'); };
  }

  // ---------- route ----------
  function stopStats(st) {
    var set = {}; st.criterion_ids.forEach(function (x) { set[x] = true; });
    var its = W.data.items.filter(function (i) { return i.in_scope && set[i.criterion_id]; });
    var done = its.filter(function (i) { var s = scoreOf(i.criterion_id); return (s.status === 'SCORED' && s.evidence && s.evidence.complete) || s.status === 'EXEMPT'; }).length;
    var visits = W.data.visits.filter(function (v) { return v.stop_id === st.id; });
    var visit = visits.filter(function (v) { return v.status === 'IN_PROGRESS'; })[0] || visits.filter(function (v) { return v.status === 'DONE'; }).slice(-1)[0] || null;
    return { total: its.length, done: done, visit: visit, visits: visits };
  }

  function renderRoute() {
    var r = W.data.route, el = App.$('#ws-route');
    if (!r || !r.stops.length) { el.innerHTML = ''; el.hidden = true; return; }
    var stops = r.stops.filter(function (s) { return s.criterion_ids.length; });
    el.innerHTML = '<div class="route-head"><h2>' + App.icon('route') + esc(r.name) + '</h2><div class="seg" role="group" aria-label="มุมมองรายการ">' +
      '<button class="seg-btn' + (!W.stop ? ' on' : '') + '" data-stop="">ทุกจุด</button><button class="seg-btn' + (W.filter === 'todo' ? ' on' : '') + '" data-filter="todo">เฉพาะที่ยังไม่ครบ</button></div></div>' +
      '<ol class="track">' + stops.map(function (st) {
        var s = stopStats(st);
        var state = s.total && s.done === s.total ? 'done' : s.visit && s.visit.status === 'IN_PROGRESS' ? 'active' : s.done ? 'partial' : 'todo';
        var label = { done: 'ครบแล้ว', active: 'กำลังตรวจ', partial: 'ตรวจบางข้อ', todo: 'ยังไม่เริ่ม' }[state];
        return '<li class="station st-' + state + (W.stop === st.id ? ' sel' : '') + '"><button data-stop="' + st.id + '" aria-pressed="' + (W.stop === st.id) + '">' +
          '<span class="st-node" aria-hidden="true">' + (state === 'done' ? App.icon('check') : '') + '</span><span class="st-name">' + esc(st.name) + '</span>' +
          '<span class="st-meta">' + (st.time_hint ? esc(st.time_hint) + ' น. • ' : '') + s.done + '/' + s.total + ' ข้อ • ' + label + '</span></button></li>';
      }).join('') + '</ol><div id="stop-bar"></div>';
    App.$$('[data-stop]', el).forEach(function (b) { b.onclick = function () { W.stop = b.getAttribute('data-stop') || null; if (!W.stop) W.filter = 'all'; renderRoute(); renderList(); var f = visibleItems()[0]; if (f && f.id !== W.sel) select(f.id); }; });
    var fb = App.$('[data-filter]', el); fb.onclick = function () { W.filter = W.filter === 'todo' ? 'all' : 'todo'; renderRoute(); renderList(); };
    renderStopBar();
  }

  function renderStopBar() {
    var bar = App.$('#stop-bar'); if (!bar) return;
    if (!W.stop) { bar.innerHTML = ''; return; }
    var st = W.data.route.stops.filter(function (s) { return s.id === W.stop; })[0];
    var s = stopStats(st);
    var hist = s.visits.map(function (v) { return (v.session_label ? esc(v.session_label) + ': ' : '') + App.fmtDate(v.started_at, true) + (v.finished_at ? ' – ' + App.fmtDate(v.finished_at, true).split(' ').pop() : ' (ยังเปิดอยู่)'); }).join('<br>');
    bar.innerHTML = '<div class="stop-bar"><div><strong>' + esc(st.name) + '</strong>' + (st.instructions ? '<p class="hint">' + esc(st.instructions) + '</p>' : '') + (hist ? '<p class="hint">ประวัติการเข้าตรวจ:<br>' + hist + '</p>' : '<p class="hint">ยังไม่ได้บันทึกการเข้าตรวจจุดนี้ — ตรวจแยกช่วงเวลาได้ ระบบเก็บทุกครั้งที่เข้า</p>') + '</div>' +
      (editable() ? '<div class="stop-actions">' + (s.visit && s.visit.status === 'IN_PROGRESS' ? '<button class="btn btn-primary" data-visit="FINISH">' + App.icon('check') + 'เสร็จจุดนี้</button>' : '<button class="btn btn-ghost" data-visit="START">' + App.icon('play') + 'เริ่มตรวจจุดนี้</button>') + '</div>' : '') + '</div>';
    App.$$('[data-visit]', bar).forEach(function (b) {
      b.onclick = function () {
        var act = b.getAttribute('data-visit');
        var label = act === 'START' ? (new Date().getHours() < 12 ? 'ช่วงเช้า ' : 'ช่วงบ่าย ') + new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '';
        b.disabled = true;
        App.api('apiRouteVisit', W.data.audit.id, W.stop, act, label, '').then(function (v) {
          W.data.visits = W.data.visits.filter(function (x) { return x.id !== v.id; }).concat([v]);
          renderRoute();
          App.toast(act === 'START' ? 'เริ่มตรวจ ' + st.name : 'บันทึกว่าเสร็จจุด ' + st.name + ' แล้ว', 'ok');
        }, function (e) { b.disabled = false; App.fail(e); });
      };
    });
  }

  // ---------- criteria list ----------
  function statusIcon(s) {
    if (s.status === 'SCORED' && s.evidence && s.evidence.complete) return '<span class="li-st li-ok" title="ครบ">' + App.icon('check') + '<span class="sr-only">ครบ</span></span>';
    if (s.status === 'SCORED') return '<span class="li-st li-warn" title="หลักฐาน/ตัวอย่างยังไม่ครบ">' + App.icon('clock') + '<span class="sr-only">หลักฐานยังไม่ครบ</span></span>';
    if (s.status === 'HELD' || s.status === 'PENDING_SCORE') return '<span class="li-st li-held" title="ระงับ">' + App.icon('pause') + '<span class="sr-only">ระงับ</span></span>';
    if (s.status === 'INSUFFICIENT') return '<span class="li-st li-warn" title="หลักฐานไม่พอ">' + App.icon('alert') + '<span class="sr-only">หลักฐานไม่พอ</span></span>';
    if (s.status === 'EXEMPT') return '<span class="li-st li-neutral" title="ยกเว้น">–<span class="sr-only">ยกเว้น</span></span>';
    return '<span class="li-st li-todo" title="ยังไม่ตรวจ"><span class="sr-only">ยังไม่ตรวจ</span></span>';
  }

  function renderList() {
    var list = visibleItems();
    var dims = W.data.standard.version.dimensions || [];
    var it = item();
    var c = it && W.crit[it.criterion_id];
    var all = W.data.items.filter(function (i) { return i.in_scope; });
    var pos = all.map(function (x) { return x.id; }).indexOf(W.sel) + 1;
    App.$('#ws-pick').innerHTML = c ? App.icon('menu') + '<span>ข้อ <strong>' + esc(c.code) + '</strong> (' + pos + '/' + all.length + ') — ' + esc(App.firstLine(App.lang(c.title)).slice(0, 40)) + '</span>' : 'เลือกข้อ';
    var prev = App.QC.prevByCode();
    var html = '<div class="list-head"><span>' + list.length + ' ข้อ' + (W.stop ? ' ในจุดนี้' : '') + '</span><label class="sr-only" for="ws-filter">แสดง</label><select id="ws-filter" class="mini-select">' +
      [['all', 'ทุกข้อ'], ['todo', 'ยังไม่ครบ'], ['priority', 'ควรดูก่อน (เวลาน้อย)'], ['prev', 'เคยพบครั้งก่อน']].map(function (o) { return '<option value="' + o[0] + '"' + (W.filter === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>';
    if (W.filter === 'priority') html += '<p class="hint list-hint">เรียงข้อที่ยังไม่ครบ: เคยพบปัญหาที่ยังไม่ปิด → เคยพบปัญหา → คะแนนสูง</p>';
    dims.forEach(function (d) {
      var its = list.filter(function (i) { return W.crit[i.criterion_id].dimension_code === d.code; });
      if (!its.length) return;
      html += '<div class="crit-dim"><h3>' + esc(App.firstLine(App.lang(d.name))) + (d.max_points != null ? ' <small>' + d.max_points + ' คะแนน</small>' : d.weight != null ? ' <small>น้ำหนัก ' + d.weight + '</small>' : '') + '</h3><ul>' +
        its.map(function (i) {
          var cc = W.crit[i.criterion_id], s = scoreOf(i.criterion_id);
          var pts = s.score != null ? App.num(s.score) + '/' + App.num(cc.max_points) : (cc.max_points != null ? '–/' + cc.max_points : '');
          return '<li><button class="crit-link' + (i.id === W.sel ? ' on' : '') + '" data-item="' + i.id + '"' + (i.id === W.sel ? ' aria-current="true"' : '') + '>' + statusIcon(s) +
            '<span class="cl-code">' + esc(cc.code) + '</span><span class="cl-title">' + esc(App.firstLine(App.lang(cc.title))) + '</span><span class="cl-pts">' + pts + '</span>' +
            (prev[cc.code] ? '<span class="cl-prev" title="ครั้งก่อนพบปัญหา ' + prev[cc.code].length + ' รายการ">เคยพบ</span>' : '') +
            (W.drafts[i.id] ? '<span class="cl-dirty" title="มีข้อมูลที่ยังไม่ถึงเซิร์ฟเวอร์">●<span class="sr-only">ยังไม่บันทึก</span></span>' : '') + '</button></li>';
        }).join('') + '</ul></div>';
    });
    if (!list.length) html += App.empty('ไม่มีข้อในมุมมองนี้', W.filter === 'todo' ? 'ทุกข้อครบแล้ว' : '');
    var el = App.$('#ws-list');
    if (W.filter === 'priority' || W.filter === 'prev') {
      // flat ordered list (not grouped by dimension)
      html = html.split('<div class="crit-dim">')[0] + '<ul class="flat">' + list.map(function (i) {
        var cc = W.crit[i.criterion_id], s = scoreOf(i.criterion_id);
        return '<li><button class="crit-link' + (i.id === W.sel ? ' on' : '') + '" data-item="' + i.id + '">' + statusIcon(s) + '<span class="cl-code">' + esc(cc.code) + '</span><span class="cl-title">' + esc(App.firstLine(App.lang(cc.title))) + '</span>' +
          (prev[cc.code] ? '<span class="cl-prev">เคยพบ</span>' : '<span class="cl-pts">' + (cc.max_points != null ? cc.max_points + ' คะแนน' : '') + '</span>') + '</button></li>';
      }).join('') + '</ul>' + (list.length ? '' : App.empty('ไม่มีข้อในมุมมองนี้', ''));
    }
    el.innerHTML = html;
    var fsel = App.$('#ws-filter', el); fsel.onchange = function () { W.filter = fsel.value; renderRoute(); renderList(); };
    App.$$('[data-item]', el).forEach(function (b) { b.onclick = function () { select(b.getAttribute('data-item')); if (window.innerWidth < 768) setStep('std'); }; });
  }

  function renderPanes() { renderStd(); renderEv(); renderAi(); renderScore(); }

  // ---------- standard pane ----------
  function langBlock(o) {
    if (!o) return '';
    var out = '';
    if (o.th) out += '<div class="lang lang-th" lang="th">' + App.nl2br(o.th) + '</div>';
    if (o.zh) out += '<details class="lang-alt"><summary>ต้นฉบับภาษาจีน</summary><div lang="zh">' + App.nl2br(o.zh) + '</div></details>';
    if (!o.th && !o.zh) out += '<div class="lang">' + App.nl2br(o.raw || o.en || '') + '</div>';
    return out;
  }
  function srcRef(r) { if (!r) return ''; return esc((r.sheet || '') + (r.cell ? ' ' + r.cell : r.row ? ' แถว ' + r.row : '')); }

    var it = item(), el = App.$('#p-std');

    var h = '<header class="pane-h"><span class="code-badge">' + esc(c.code) + '</span><h2>' + esc(App.firstLine(App.lang(c.title))) + '</h2></header>' + App.QC.prevBlock(c.code);
    h += '<dl class="facts">' + (c.max_points != null ? '<div><dt>คะแนนเต็ม</dt><dd>' + c.max_points + '</dd></div>' : c.max_points_source === 'ITEM_GROUP' ? '<div><dt>คะแนนเต็ม</dt><dd class="t-held">ยังไม่กำหนด</dd></div>' : '') +
      (c.kup_type ? '<div><dt>ประเภท</dt><dd>' + esc(c.kup_type === 'C' ? 'C ความสามารถ' : c.kup_type === 'A' ? 'A การปฏิบัติ' : c.kup_type) + '</dd></div><div><dt>ความสำคัญ</dt><dd>' + esc(c.kup_importance) + '</dd></div>' : '') +
      (it.sample_required ? '<div><dt>ตัวอย่างที่ต้องตรวจ</dt><dd>' + it.sample_required + (c.sample && c.sample.unit ? ' <small>(' + esc(c.sample.unit) + ')</small>' : '') + '</dd></div>' : c.sample ? '<div><dt>ตัวอย่าง</dt><dd>' + esc(c.sample.text || '') + '</dd></div>' : '') +
      (c.time_hint ? '<div><dt>เวลาที่กำหนด</dt><dd>' + esc(c.time_hint) + ' น.</dd></div>' : '') + '</dl>';
    h += '<h3 class="sub">ข้อกำหนด / เนื้อหาการประเมิน</h3>' + langBlock(c.requirement);

    if (c.target_role && (c.target_role.th || c.target_role.zh)) h += '<p class="hint">ผู้ถูกประเมิน: ' + esc(c.target_role.th || c.target_role.zh) + '</p>';

      }).join('') + '</ol>';
    } else {
      h += '<h3 class="sub">เกณฑ์ให้คะแนน</h3><ul class="rules">' + rules.map(function (r) {
        return '<li><span class="rule-code">' + esc(r.rule_code) + '</span><span class="rule-type">' + esc(RTYPE[r.rule_type] || r.rule_type) + (r.points ? ' ' + r.points + ' คะแนน' : '') + '</span><div class="rule-text">' + esc(r.text.th || r.text.zh) + (r.text.th && r.text.zh ? '<details class="lang-alt"><summary>ภาษาจีน</summary>' + esc(r.text.zh) + '</details>' : '') + '</div></li>';
      }).join('') + '</ul>' + (rules.length > 0 && rules[0].criterion_ids.length > 1 ? '<p class="hint">เกณฑ์ชุดนี้ใช้ร่วมกับข้อ ' + esc(rules[0].criterion_ids.filter(function (x) { return x !== c.id; }).map(function (x) { return W.crit[x] ? W.crit[x].code : ''; }).join(', ')) + ' (เซลล์รวมในไฟล์)</p>' : '');
    }

    if (flags.length) h += '<details class="flags"><summary>' + App.icon('alert') + 'หมายเหตุจากการนำเข้า (' + flags.length + ')</summary><ul>' + flags.map(function (f) { return '<li>' + esc(f.message_th) + '</li>'; }).join('') + '</ul></details>';

        '<small>ภาพ ≤10 MB • เสียง ≤15 MB • PDF ≤15 MB • วิดีโอ ≤25 MB (ยังไม่วิเคราะห์ด้วย AI)</small></div>' +

    }
    h += '<ul class="ev-list" id="ev-list">' + (evs.length ? evs.map(evRow).join('') : '<li class="ev-empty">' + App.empty('ยังไม่มีหลักฐานในข้อนี้', canEd ? 'ถ่ายภาพ บันทึกเสียง แนบเอกสาร หรือพิมพ์บันทึกหน้างาน' : '') + '</li>') + '</ul>';
    if (canEd) h += '<button class="btn btn-ghost" id="ev-link">' + App.icon('link') + 'ใช้หลักฐานที่มีอยู่ในรอบนี้</button>';

  // ---------- AI pane ----------

    else if (ai.free_tier_notice) h += '<p class="notice notice-info small">ใช้ Gemini แบบฟรี: Google อาจนำข้อมูลที่ส่งไปใช้ปรับปรุงบริการ — หลีกเลี่ยงภาพที่มีข้อมูลลับ</p>';
    if (!App.state.online) h += '<p class="notice notice-warn">ออฟไลน์อยู่ — การวิเคราะห์ด้วย AI ต้องใช้อินเทอร์เน็ต</p>';
    if (editable()) h += '<div class="ai-actions"><button class="btn btn-primary" id="ai-run"' + (ai.connected && App.state.online ? '' : ' disabled') + '>' + App.icon('ai') + (run && run.status === 'SUCCEEDED' ? 'วิเคราะห์ใหม่' : 'วิเคราะห์ด้วย AI') + '</button>' +
      '<span class="hint">ส่งหลักฐาน ' + itemEvidence(it).filter(function (e) { return e.analysis_supported; }).length + ' ชิ้น' + (it.auditor_notes ? ' + บันทึกผู้ตรวจ' : '') + '</span></div><div id="ai-status" role="status" aria-live="polite"></div>';
    if (!run) h += App.empty('ยังไม่ได้วิเคราะห์', 'แนบหลักฐานแล้วกด "วิเคราะห์ด้วย AI" — AI จะเทียบกับมาตรฐานของข้อนี้และเสนอผล ผู้ตรวจเป็นผู้ยืนยันเสมอ');
    else h += runView(run, it, c);

    App.$$('[data-ref]', el).forEach(function (x) { x.onclick = function () { var id = x.getAttribute('data-ref'); var e = W.data.evidence.filter(function (y) { return y.id === id; })[0]; if (!e) return; if (e.kind === 'AUDIO') { setStep('ev'); var t = parseLoc(x.getAttribute('data-loc')); setTimeout(function () { loadAudio(id, t); }, 50); } else if (e.kind === 'NOTE') App.dialog({ title: 'บันทึก ' + e.short_id, body: '<p>' + App.nl2br(e.note_text) + '</p>' }); else App.viewEvidence(id); }; });
  }
  function parseLoc(l) { var m = /(\d+):(\d{2})/.exec(l || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : 0; }

  function refLinks(refs) {
    return (refs || []).map(function (r) {
      if (r.evidence_id === 'AUDITOR-NOTES') return '<span class="ref">บันทึกผู้ตรวจ' + (r.locator ? ' @ ' + esc(r.locator) : '') + '</span>';
      var e = W.data.evidence.filter(function (x) { return x.id === r.evidence_id; })[0];
      return '<button class="ref" data-ref="' + esc(r.evidence_id) + '" data-loc="' + esc(r.locator || '') + '">' + esc(e ? e.short_id : r.evidence_id) + (r.locator ? ' @ ' + esc(r.locator) : '') + '</button>';
    }).join(' ');
  }

  function runView(run, it, c) {
    var h = '<p class="t-muted small">' + esc(run.provider + ' / ' + run.model) + ' • prompt ' + esc(run.prompt_version) + ' • ' + App.fmtDate(run.finished_at || run.started_at, true) + ' • ครั้งที่ ' + run.attempt + '</p>';
    if (run.skipped_evidence && run.skipped_evidence.length) h += '<p class="notice notice-warn small">ไม่ได้ส่งให้ AI ' + run.skipped_evidence.length + ' ไฟล์: ' + esc(run.skipped_evidence.map(function (s) { var e = W.data.evidence.filter(function (x) { return x.id === s.id; })[0]; return (e ? e.short_id : '') + ' (' + s.reason + ')'; }).join(', ')) + '</p>';
    if (run.status === 'FAILED') return h + '<p class="notice notice-bad">AI ทำงานไม่สำเร็จ: ' + esc(run.error_message) + ' — กดวิเคราะห์ใหม่ได้ ระบบจะไม่สร้างปัญหาหรือคะแนนซ้ำ</p>';
    if (run.status === 'INVALID_OUTPUT') return h + '<p class="notice notice-bad">ผล AI ไม่ผ่านการตรวจสอบจึงไม่นำมาใช้</p><ul class="plain-list small">' + (run.validation_errors || []).map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>';
    if (run.status !== 'SUCCEEDED' || !run.parsed) return h;
    var p = run.parsed, prop = run.engine_proposal || {};
    h += '<div class="ai-result"><div class="ai-verdict">' + App.chip(p.result) + (prop.mode === 'DEDUCTION' && prop.score != null ? '<span class="ai-score">คะแนนเสนอ <strong>' + App.num(prop.score) + '</strong> / ' + App.num(prop.max) + '</span>' : '') +
      (prop.mode === 'BAND' && prop.band ? '<span class="ai-score">ช่วงคะแนนเสนอ <strong>' + prop.band.min + '–' + prop.band.max + '</strong></span>' : '') + '</div>';
    if (prop.hold_reasons && prop.hold_reasons.length) h += '<p class="notice notice-held small">' + esc(prop.hold_reasons.join('; ')) + '</p>';
    if (prop.note) h += '<p class="hint">' + esc(prop.note) + '</p>';
    ['FACT', 'STATEMENT', 'ASSUMPTION'].forEach(function (t) {
      var list = p.observations.filter(function (o) { return o.type === t; });

      h += '<h3 class="sub obs-' + t.toLowerCase() + '">' + OBS[t] + '</h3><ul class="obs">' + list.map(function (o) { return '<li>' + esc(o.text) + (o.evidence_references.length ? '<div class="refs">' + refLinks(o.evidence_references) + '</div>' : '') + '</li>'; }).join('') + '</ul>';
    });
    if (p.issues.length) h += '<h3 class="sub">ปัญหาที่พบ (อ้างกฎ)</h3><ul class="obs">' + p.issues.map(function (is) { var r = W.rules[is.rule_id]; return '<li><strong>' + esc(is.issue_key) + '</strong> — ' + esc(is.description) + ' <span class="rule-code">' + esc(r ? r.rule_code : is.rule_code) + '</span>' + (is.evidence_ids.length ? '<div class="refs">' + refLinks(is.evidence_ids.map(function (x) { return { evidence_id: x }; })) + '</div>' : '') + '</li>'; }).join('') + '</ul>';
    if (p.conflicts.length) h += '<h3 class="sub t-bad">ความขัดแย้งระหว่างหลักฐาน</h3><ul class="obs">' + p.conflicts.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (p.missing_evidence.length) h += '<h3 class="sub">หลักฐานที่ควรเก็บเพิ่ม</h3><ul class="checklist">' + p.missing_evidence.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (p.suggested_questions.length) h += '<h3 class="sub">คำถามที่ควรถามเพิ่ม</h3><ul class="checklist">' + p.suggested_questions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';

    h += '<details class="rationale"><summary>เหตุผลของ AI</summary><p>' + App.nl2br(p.rationale) + '</p></details>';
    if (editable()) h += '<button class="btn btn-ghost" id="ai-use">ใช้ผลนี้เป็นร่างคะแนน</button><p class="hint">ผลจะถูกคัดลอกไปที่ส่วนคะแนน ผู้ตรวจยังต้องตรวจทานและกดยืนยัน</p>';
    return h + '</div>';
  }

  function analyze(it, force) {
    var st = App.$('#ai-status'), b = App.$('#ai-run');

  }

  function useAi(it, run) {

    else patch.issues = p.issues.map(function (is) { return { issue_key: is.issue_key, rule_id: is.rule_id, description: is.description, evidence_ids: is.evidence_ids, source: 'AI_PROPOSED' }; });

    App.toast('คัดลอกผล AI เป็นร่างแล้ว — ตรวจทานก่อนยืนยัน', 'info');
  }

  // ---------- score pane ----------

    if (W.mode === 'BAND') {
      var bands = c.bands || [];
      h += '<div class="form-grid"><label class="field"><span>ช่วงคะแนน</span><select id="f-band"' + dis + '><option value="">เลือกช่วง</option>' + bands.map(function (b, i) { return '<option value="' + i + '"' + (v.band_index === i ? ' selected' : '') + '>' + b.min + '–' + b.max + (it.ai_band_index === i ? ' (AI เสนอ)' : '') + '</option>'; }).join('') + '</select></label>' +
        '<label class="field"><span>คะแนนในช่วง</span><input id="f-bscore" type="number" step="0.5" inputmode="decimal"' + (v.band_index != null && bands[v.band_index] ? ' min="' + bands[v.band_index].min + '" max="' + bands[v.band_index].max + '"' : '') + ' value="' + (v.band_score == null ? '' : v.band_score) + '"' + dis + '></label></div>' +
        '<p class="hint">มาตรฐานไม่มีเกณฑ์เลือกคะแนนจุดเดียวภายในช่วง — ผู้ตรวจเป็นผู้ตัดสิน</p>';
    } else {

      var evs = itemEvidence(it);
      h += '<div class="issues" id="issues"><div class="issues-h"><strong>ปัญหาที่พบ</strong><span class="hint">ปัญหาเดียวกันจากหลายหลักฐานให้ใช้ชื่อเดียวกัน — ระบบหักครั้งเดียว</span></div>' +
        (v.issues || []).map(function (is, i) {
          return '<div class="issue" data-i="' + i + '"><label class="field"><span>ชื่อปัญหา</span><input data-k="issue_key" value="' + esc(is.issue_key) + '" list="issue-keys"' + dis + '></label>' +
            '<label class="field"><span>กฎที่ใช้</span><select data-k="rule_id"' + dis + '>' + rules.map(function (r) { return '<option value="' + r.id + '"' + (r.id === is.rule_id ? ' selected' : '') + '>' + esc(r.rule_code + ' ' + (RTYPE[r.rule_type] || '') + (r.points ? ' ' + r.points : '') + ' — ' + App.firstLine(r.text.th || r.text.zh).slice(0, 50)) + '</option>'; }).join('') + '</select></label>' +
            '<label class="field span-2"><span>รายละเอียด</span><input data-k="description" value="' + esc(is.description || '') + '"' + dis + '></label>' +
            '<div class="field span-2"><span class="lbl">หลักฐาน</span><div class="ev-chips">' + (evs.length ? evs.map(function (e) { return '<label class="chip-check"><input type="checkbox" data-ev="' + e.id + '"' + ((is.evidence_ids || []).indexOf(e.id) >= 0 ? ' checked' : '') + dis + '><span>' + esc(e.short_id) + '</span></label>'; }).join('') : '<span class="t-muted">ยังไม่มีหลักฐานในข้อนี้</span>') + '</div></div>' +
            (is.source === 'AI_PROPOSED' ? '<span class="chip chip-info">จาก AI</span>' : '') + (canEd ? '<button class="link-btn t-bad" data-rm="' + i + '">' + App.icon('trash') + 'ลบปัญหานี้</button>' : '') + '</div>';
        }).join('') + '<datalist id="issue-keys">' + (v.issues || []).map(function (is) { return '<option value="' + esc(is.issue_key) + '">'; }).join('') + '</datalist>' +
        (canEd ? '<button class="btn btn-ghost btn-sm" id="add-issue"' + (rules.length ? '' : ' disabled') + '>' + App.icon('plus') + 'เพิ่มปัญหา</button>' : '') + '</div>';
    }
    // calculation

    h += '<details class="override"' + (v.override_score != null ? ' open' : '') + '><summary>แก้คะแนนต่างจากที่คำนวณ</summary><div class="form-grid"><label class="field"><span>คะแนนที่ผู้ตรวจกำหนด</span><input id="f-ov" type="number" step="0.5" min="0" max="' + (c.max_points || 10) + '" value="' + (v.override_score == null ? '' : v.override_score) + '"' + dis + '></label>' +

      (it.exemption_status === 'REQUESTED' && W.data.permissions.approve_exemption ? ' <button class="btn btn-sm btn-primary" data-ex="1">อนุมัติ</button> <button class="btn btn-sm btn-ghost" data-ex="0">ไม่อนุมัติ</button>' : '') + '</p>';

      (!it.exemption_status || it.exemption_status === 'REJECTED' ? '<button class="link-btn" id="ask-ex">ขอยกเว้นข้อนี้</button>' : '') + '</div>';

  function calcView(s, c) {
    if (!s.status || s.status === 'NOT_STARTED') return '<p class="t-muted">ยังไม่มีผล — เลือกผลการตรวจก่อน</p>';
    if (s.status === 'INSUFFICIENT') return '<p class="t-warn"><strong>หลักฐานไม่พอ</strong> — ไม่นับเป็น 0 และไม่นับเป็นผ่าน ต้องเก็บหลักฐานเพิ่มหรือขอยกเว้น</p>';
    var h = '<div class="calc-row"><span>คะแนนเต็ม</span><strong>' + App.num(c.max_points) + '</strong></div>';
    (s.deductions || []).forEach(function (d) { h += '<div class="calc-row"><span>' + esc(d.rule_code) + ' • ' + esc(d.issue_key) + (d.note ? ' <small>(' + esc(d.note) + ')</small>' : '') + '</span><strong class="t-bad">−' + App.num(d.points) + '</strong></div>'; });
    if (s.zero_rule_id) h += '<div class="calc-row"><span>เข้าเงื่อนไข 0 คะแนน</span><strong class="t-bad">0</strong></div>';
    if (s.floor_applied) h += '<div class="calc-row"><span>ปรับต่ำสุดเป็น 0 ตามที่ Admin ยืนยัน</span><strong>0</strong></div>';
    if (s.overridden) h += '<div class="calc-row"><span>ผู้ตรวจแก้จาก ' + App.num(s.override_from) + '</span><strong>' + App.num(s.score) + '</strong></div>';
    h += '<div class="calc-row total"><span>คะแนนข้อนี้</span><strong>' + (s.score == null ? 'ระงับ' : App.num(s.score)) + '</strong></div>';
    if (s.hold_reasons && s.hold_reasons.length) h += '<p class="notice notice-held small">' + esc(s.hold_reasons.join('; ')) + '</p>';
    if (s.evidence && !s.evidence.complete && s.status === 'SCORED') h += '<p class="notice notice-warn small">' + (s.evidence.sample_required != null && s.evidence.sample_collected < s.evidence.sample_required ? 'ตัวอย่างยังไม่ครบ ' + s.evidence.sample_collected + '/' + s.evidence.sample_required : 'ยังไม่มีหลักฐานหรือบันทึก') + ' — ข้อนี้ยังไม่นับว่าครบ</p>';
    return h;
  }

  function wireScore(it, el) {
    if (!editable()) { App.$$('[data-ex]', el).forEach(wireEx(it)); return; }
    var c = W.crit[it.criterion_id];
    App.$$('input[name=f-result]', el).forEach(function (r) { r.onchange = function () { setDraft(it.id, { result: r.value }, true); }; });
    var band = App.$('#f-band', el); if (band) band.onchange = function () { setDraft(it.id, { band_index: band.value === '' ? null : Number(band.value) }, true); renderScore(); renderStd(); };
    var bs = App.$('#f-bscore', el); if (bs) bs.oninput = function () { setDraft(it.id, { band_score: bs.value === '' ? null : Number(bs.value) }); };
    var ov = App.$('#f-ov', el), ovr = App.$('#f-ovr', el);
    ov.oninput = function () { setDraft(it.id, { override_score: ov.value === '' ? null : Number(ov.value) }); };
    ovr.oninput = function () { setDraft(it.id, { override_reason: ovr.value }); };
    var issues = function () { return JSON.parse(JSON.stringify(view(it).issues || [])); };
    var box = App.$('#issues', el);
    if (box) {
      box.addEventListener('input', function (e) {
        var row = e.target.closest('.issue'); if (!row) return;
        var list = issues(), i = Number(row.getAttribute('data-i'));
        var k = e.target.getAttribute('data-k');
        if (k) list[i][k] = e.target.value;
        if (e.target.hasAttribute('data-ev')) { var id = e.target.getAttribute('data-ev'); var set = list[i].evidence_ids || []; list[i].evidence_ids = e.target.checked ? set.concat([id]) : set.filter(function (x) { return x !== id; }); }
        setDraft(it.id, { issues: list }, e.target.tagName === 'SELECT' || e.target.type === 'checkbox');
      });
      App.$$('[data-rm]', box).forEach(function (b) { b.onclick = function () { var list = issues(); list.splice(Number(b.getAttribute('data-rm')), 1); setDraft(it.id, { issues: list }, true); renderScore(); }; });
      var add = App.$('#add-issue', box);
      if (add) add.onclick = function () {
        var rules = W.data.standard.rules.filter(function (r) { return r.criterion_ids.indexOf(c.id) >= 0; });
        var per = rules.filter(function (r) { return r.rule_type === 'PER_OCCURRENCE'; })[0] || rules[0];
        var list = issues(); list.push({ issue_key: 'ปัญหา ' + (list.length + 1), rule_id: per.id, description: '', evidence_ids: [] });
        var v = view(it);
        setDraft(it.id, { issues: list, result: v.result || 'NONCONFORM' }, false);
        renderScore();
        var inputs = App.$$('.issue input[data-k=issue_key]', App.$('#p-score')); if (inputs.length) { inputs[inputs.length - 1].focus(); inputs[inputs.length - 1].select(); }
      };
    }
    App.$('#mark-rev', el).onclick = function () {
      var v = view(it);
      if (!v.result) { App.toast('เลือกผลการตรวจก่อนยืนยัน', 'error'); return; }
      if (v.override_score != null && !(v.override_reason || '').trim()) { App.toast('แก้คะแนนต้องระบุเหตุผล', 'error'); ovr.focus(); return; }
      setDraft(it.id, { mark_reviewed: true });
      saveNow(it.id).then(function (ok) { if (ok) { App.toast('ยืนยันผลข้อ ' + c.code + ' แล้ว', 'ok'); } });
    };
    var ex = App.$('#ask-ex', el);
    if (ex) ex.onclick = function () {
      App.ask('ขอยกเว้นข้อ ' + c.code, 'เหตุผล (ต้องได้รับอนุมัติจาก Admin ก่อนปิดรอบตรวจ)', { ok: 'ส่งคำขอ' }).then(function (reason) {
        if (!reason) return;
        App.api('apiRequestExemption', it.id, reason).then(function (r) { mergeItem(r.item); applyScore(r.score); renderScore(); App.toast('ส่งคำขอยกเว้นแล้ว', 'ok'); }, App.fail);
      });
    };
    App.$$('[data-ex]', el).forEach(wireEx(it));
  }
  function wireEx(it) {
    return function (b) {
      b.onclick = function () {
        var ok = b.getAttribute('data-ex') === '1';
        App.api('apiDecideExemption', it.id, ok, '').then(function (r) { mergeItem(r.item); applyScore(r.score); renderScore(); renderList(); App.toast(ok ? 'อนุมัติการยกเว้นแล้ว' : 'ไม่อนุมัติการยกเว้น', 'ok'); }, App.fail);
      };
    };
  }

  // ---------- drafts, autosave, offline, conflicts ----------
  function draftKey(id) { return 'cps_draft_' + id; }
  function setDraft(id, patch, immediate) {
    var d = W.drafts[id] = W.drafts[id] || { patch: {}, base_version: item(id).version, ts: Date.now() };
    Object.keys(patch).forEach(function (k) { d.patch[k] = patch[k]; });
    d.ts = Date.now();
    App.store.set(draftKey(id), { audit_id: W.data.audit.id, patch: d.patch, base_version: d.base_version, ts: d.ts });
    W.saving[id] = 'dirty'; renderSave(); markDirty(id);
    if (immediate) saveNow(id); else debouncedSave(id);
  }
  var timers = {};
  function debouncedSave(id) { clearTimeout(timers[id]); timers[id] = setTimeout(function () { saveNow(id); }, 1200); }
  function flush(id) { clearTimeout(timers[id]); return W.drafts[id] ? saveNow(id) : Promise.resolve(true); }
  function flushAll() { Object.keys(W.drafts).forEach(function (id) { flush(id); }); }

  function saveNow(id) {
    clearTimeout(timers[id]);
    var d = W.drafts[id];
    if (!d) { W.saving[id] = 'saved'; renderSave(); return Promise.resolve(true); }
    if (W.saving[id] === 'saving') { return new Promise(function (res) { setTimeout(function () { res(saveNow(id)); }, 400); }); }
    var sentPatch = JSON.parse(JSON.stringify(d.patch)), sentTs = d.ts;
    W.saving[id] = 'saving'; renderSave();
    return App.api('apiSaveItemDraft', id, sentPatch, item(id).version).then(function (r) {
      mergeItem(r.item); applyScore(r.score);
      var cur = W.drafts[id];
      if (cur && cur.ts === sentTs) { delete W.drafts[id]; App.store.del(draftKey(id)); }
      else if (cur) { Object.keys(sentPatch).forEach(function (k) { if (JSON.stringify(cur.patch[k]) === JSON.stringify(sentPatch[k])) delete cur.patch[k]; }); delete cur.patch.mark_reviewed; debouncedSave(id); }
      W.saving[id] = 'saved'; W.savedAt = new Date(); renderSave();
      if (id === W.sel) {
        var sp = App.$('#p-score');
        if (sp && sp.contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON') { var calc = App.$('.calc', sp); if (calc) calc.innerHTML = calcView(scoreOf(item(id).criterion_id), W.crit[item(id).criterion_id]); }
        else renderScore();
        if (sentPatch.band_index !== undefined || sentPatch.result) renderStd();
      }
      renderList(); renderRoute(); renderHead();
      return true;
    }, function (e) {
      if (e.network) {
        W.saving[id] = 'queued'; renderSave();
        App.Queue.add({ key: 'item:' + id, fn: 'apiSaveItemDraft', args: [id, sentPatch, item(id).version], onDone: 'itemSaved' });
        return false;
      }
      if (e.code === 'CONFLICT') { W.saving[id] = 'conflict'; renderSave(); conflict(id, e); return false; }
      W.saving[id] = 'error'; W.lastError = App.errorText(e); renderSave();
      if (sentPatch.mark_reviewed) { App.fail(e); if (W.drafts[id]) delete W.drafts[id].patch.mark_reviewed; }
      return false;
    });
  }
  App.queueHandlers.itemSaved = function (r, e) {
    var id = e.args[0];
    App.store.del(draftKey(id));
    if (W.data && W.data.items.some(function (i) { return i.id === id; })) { delete W.drafts[id]; mergeItem(r.item); applyScore(r.score); W.saving[id] = 'saved'; renderSave(); renderList(); if (id === W.sel) renderPanes(); }
    App.toast('ส่งข้อมูลที่ค้างไว้ถึงเซิร์ฟเวอร์แล้ว', 'ok');
  };
  App.queueHandlers.failed = function (err, e) {
    if (err.code === 'CONFLICT' && e.fn === 'apiSaveItemDraft' && W.data) { conflict(e.args[0], err); return; }
    App.toast('ส่งข้อมูลที่ค้างไว้ไม่สำเร็จ: ' + App.errorText(err), 'error');
  };

  function conflict(id, e) {
    var cur = e.current || {}, d = W.drafts[id];
    var c = W.crit[item(id).criterion_id];
    var show = function (o) { return '<ul class="plain-list small"><li>ผล: ' + esc((App.STATUS[o.result] || ['–'])[0]) + '</li><li>บันทึก: ' + esc(String(o.auditor_notes || '–').slice(0, 120)) + '</li><li>จำนวนปัญหา: ' + ((o.issues || []).length) + '</li></ul>'; };
    App.dialog({ title: 'ข้อ ' + c.code + ' ถูกแก้ไขจากอุปกรณ์อื่น', body: '<p>มีการบันทึกข้อนี้จากอุปกรณ์อื่นหลังจากที่คุณเปิดหน้านี้ เลือกข้อมูลที่จะใช้</p><div class="cmp"><div><h3>บนเซิร์ฟเวอร์ (ล่าสุด)</h3>' + show(cur) + '</div><div><h3>ของคุณ (ยังไม่บันทึก)</h3>' + show(Object.assign({}, cur, d ? d.patch : {})) + '</div></div>',
      actions: [{ label: 'ใช้ข้อมูลบนเซิร์ฟเวอร์', value: 'server' }, { label: 'บันทึกทับด้วยข้อมูลของฉัน', kind: 'primary', value: 'mine' }] }).then(function (v) {
      mergeItem(cur);
      if (v === 'mine' && d) { d.base_version = cur.version; W.saving[id] = 'dirty'; saveNow(id); }
      else { delete W.drafts[id]; App.store.del(draftKey(id)); W.saving[id] = 'saved'; renderSave(); W.reload(); }
    });
  }

  function restoreLocalDrafts() {
    var restored = 0;
    W.data.items.forEach(function (i) {
      var d = App.store.get(draftKey(i.id));
      if (d && d.audit_id === W.data.audit.id && d.patch) { W.drafts[i.id] = { patch: d.patch, base_version: d.base_version, ts: d.ts }; W.saving[i.id] = 'dirty'; restored++; }
    });
    if (restored) setTimeout(function () { App.toast('พบข้อมูลที่ยังไม่ได้ส่งจากอุปกรณ์นี้ ' + restored + ' ข้อ — กำลังส่ง', 'warn'); Object.keys(W.drafts).forEach(function (id) { saveNow(id); }); }, 300);
  }

  function mergeItem(it) { if (!it) return; W.data.items = W.data.items.map(function (x) { return x.id === it.id ? it : x; }); }
  function applyScore(s) { if (s) W.data.score = s; }
  function markDirty(id) { var b = App.$('[data-item="' + id + '"]'); if (b && !b.querySelector('.cl-dirty')) b.insertAdjacentHTML('beforeend', '<span class="cl-dirty" title="มีข้อมูลที่ยังไม่ถึงเซิร์ฟเวอร์">●</span>'); }

  function renderSave() {
    var el = App.$('#save-state'); if (!el) return;
    var states = Object.keys(W.saving).map(function (k) { return W.saving[k]; });
    var st = states.indexOf('conflict') >= 0 ? 'conflict' : states.indexOf('error') >= 0 ? 'error' : states.indexOf('queued') >= 0 ? 'queued' : states.indexOf('saving') >= 0 ? 'saving' : states.indexOf('dirty') >= 0 ? 'dirty' : 'saved';
    var map = {
      saved: ['ok', W.savedAt ? 'บันทึกแล้ว ' + W.savedAt.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : 'ข้อมูลเป็นปัจจุบัน'],
      dirty: ['info', 'มีการแก้ไข — กำลังรอบันทึก'], saving: ['info', 'กำลังบันทึก…'],
      queued: ['warn', 'บันทึกไม่สำเร็จ — เก็บไว้ในเครื่อง จะส่งเมื่อออนไลน์'], error: ['bad', 'บันทึกไม่สำเร็จ' + (W.lastError ? ': ' + W.lastError : '')], conflict: ['bad', 'ข้อมูลชนกับอุปกรณ์อื่น — เลือกข้อมูลที่จะใช้']
    };
    var m = map[st];
    el.className = 'save-state s-' + m[0];
    el.innerHTML = (st === 'saving' ? '<span class="spinner"></span>' : App.icon(m[0] === 'ok' ? 'check' : m[0] === 'bad' ? 'alert' : 'clock')) + '<span>' + esc(m[1]) + '</span>';
  }

  window.addEventListener('beforeunload', function (e) {
    if (W.data && Object.keys(W.drafts).length && App.hash().indexOf('#/audit/') === 0) { flushAll(); e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && W.data) flushAll(); });
})();

</script>

  <script>
/* Score summary, red lines, confirm, exports */
(function () {
  'use strict';
  var App = window.App, esc = App.esc;

  App.route('/audit/:id/summary', function (id) {
    App.setTitle('สรุปคะแนน');
    App.$('#main').innerHTML = App.loading();
    App.api('apiGetAudit', id).then(function (d) { App.WS.data = d; render(d); }, function (e) { App.$('#main').innerHTML = App.errorBox(e, 'App.render()'); });
  });

  function render(d) {
    var a = d.audit, s = d.score, mode = d.standard.set.scoring_mode;
    var crit = {}; d.standard.criteria.forEach(function (c) { crit[c.id] = c; });
    var items = {}; d.items.forEach(function (i) { items[i.criterion_id] = i; });
    var rules = {}; d.standard.rules.forEach(function (r) { rules[r.id] = r; });
    var confirmed = a.status === 'CONFIRMED';
    App.setTitle('สรุปคะแนน ' + a.audit_no);
    var h = [];
    h.push('<div class="page-head"><div><a class="link-btn" href="#/audit/' + a.id + '">' + App.icon('chevl') + 'กลับไปหน้าตรวจ</a><h2 class="h-lg">' + esc(a.audit_no) + ' ' + App.chip(a.status) + '</h2>' +
      '<p class="muted">' + esc(App.typeLabel[a.audit_type]) + ' • ' + esc([d.workshop && d.workshop.code, d.group && d.group.name, d.team && d.team.name].filter(Boolean).join(' / ')) + ' • ' + esc(a.audit_date) + ' • ' + esc(d.standard.set.name_th) + ' ' + esc(d.standard.version.version_label) + '</p></div>' +
      '<div class="head-actions">' + (function () { var n = App.QC.nextTeamHref(a); return n && App.can('audit') ? '<a class="btn btn-primary" href="' + n.href + '">' + App.icon('chevr') + 'ตรวจทีมถัดไป: ' + esc(n.name) + '</a>' : ''; })() + '<button class="btn btn-ghost" data-exp="xlsx">' + App.icon('download') + 'Excel คะแนนรายข้อ</button><button class="btn btn-ghost" data-exp="pdf">' + App.icon('download') + 'PDF สรุปรอบ</button></div></div>');

    // score block — provisional vs final kept separate
    h.push('<section class="score-hero"><div class="sh-block"><span class="sh-label">' + (confirmed ? 'คะแนนสุดท้าย' : 'คะแนนสุดท้าย') + '</span><span class="sh-value">' +
      (confirmed ? (a.final_score == null ? '<span class="nodata">ไม่มี (ระงับ)</span>' : App.num(a.final_score) + '<small> / ' + App.num(a.final_of_max) + '</small>') :
        (s.final_score != null && s.can_confirm ? App.num(s.final_score) + '<small> / ' + App.num(s.final_of_max) + ' (รอยืนยัน)</small>' : '<span class="nodata">ยังไม่มี</span>')) + '</span>' +
      (a.scope_mode === 'PARTIAL' ? '<span class="t-warn">ตรวจบางส่วน — ไม่ใช่ผลของทั้งมาตรฐาน</span>' : '') + (s.level ? '<span>ระดับระบบ: ' + esc(s.level) + '</span>' : '') + '</div>' +
      '<div class="sh-block"><span class="sh-label">คะแนนชั่วคราว</span><span class="sh-value sh-sub">' + (s.provisional.score == null ? '–' : App.num(s.provisional.score) + '<small> จาก ' + App.num(s.provisional.of_max) + '</small>') + '</span><span class="muted">' + esc(s.provisional.note) + '</span></div>' +
      '<div class="sh-block"><span class="sh-label">ความครบถ้วนหลักฐาน</span><span class="sh-value sh-sub">' + (s.coverage.pct == null ? '–' : App.num(s.coverage.pct, 0) + '%') + '</span><span class="muted">' + s.coverage.covered + ' จาก ' + s.coverage.required + ' ข้อในขอบเขต</span></div>' +
      (s.red_line ? '<div class="sh-block"><span class="sh-label">Red Line</span><span class="sh-value sh-sub">' + s.red_line.confirmed_count + '</span><span class="muted">' + (s.red_line.confirmed_count ? (s.red_line.held ? 'ยังไม่กำหนดวิธีนับ — ระงับคะแนน' : 'หัก ' + s.red_line.deduction + ' คะแนน') : 'ไม่พบ') + '</span></div>' : '') + '</section>');

    if (!confirmed) {
      var blockers = s.blockers.concat(s.hold_reasons.map(function (r) { return { code: '-', reason: r }; }));
      if (blockers.length) h.push('<section class="panel panel-warn"><h2 class="panel-title">' + App.icon('alert') + 'ยังยืนยันรอบตรวจไม่ได้ (' + blockers.length + ' รายการ)</h2><ul class="blockers">' +
        blockers.map(function (b) { var it = b.code !== '-' ? d.standard.criteria.filter(function (c) { return c.code === b.code; })[0] : null; return '<li>' + (it ? '<a href="#/audit/' + a.id + '" data-jump="' + it.id + '"><strong>' + esc(b.code) + '</strong></a> ' : '') + esc(b.reason) + '</li>'; }).join('') + '</ul></section>');
      else h.push('<section class="panel panel-ok"><h2 class="panel-title">' + App.icon('check') + 'ทุกข้อครบแล้ว พร้อมยืนยันรอบตรวจ</h2><p>เมื่อยืนยันแล้ว คะแนนและหลักฐานจะแก้ไขไม่ได้ และระบบจะสร้างรายการปัญหาให้ติดตามการแก้ไข</p>' +
        (d.permissions.confirm ? '<button class="btn btn-primary" id="btn-confirm">' + App.icon('check') + 'ยืนยันรอบตรวจ</button>' : '<p class="hint">คุณไม่มีสิทธิ์ยืนยันรอบตรวจนี้</p>') + '</section>');
    }

    if (d.standard.red_lines.length) h.push(redLinePanel(d));

    if (mode === 'BAND' && s.categories) h.push('<section class="panel"><h2 class="panel-title">คะแนนรายหมวด KUP</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>หมวด</th><th class="num">น้ำหนัก</th><th class="num">ตรวจแล้ว</th><th class="num">คะแนนหมวด (0–10)</th></tr></thead><tbody>' +
      s.categories.map(function (c) { return '<tr><td>' + esc(c.code + ' ' + App.firstLine(App.lang(c.name))) + '</td><td class="num">' + App.num(c.weight) + '</td><td class="num">' + c.scored + '/' + c.items + '</td><td class="num">' + (c.score == null ? '–' : App.num(c.score)) + '</td></tr>'; }).join('') + '</tbody></table></div></section>');

    h.push('<section class="panel"><h2 class="panel-title">คะแนนรายข้อ</h2><div class="table-wrap"><table class="tbl tbl-cards sum-tbl"><thead><tr><th>ข้อ</th><th>หัวข้อ</th><th class="num">คะแนนเต็ม</th><th class="num">AI เสนอ</th><th class="num">คะแนนยืนยัน</th><th class="num">คะแนนหัก</th><th>เหตุผล</th><th>หลักฐาน</th><th>สถานะ</th></tr></thead><tbody>' +
      s.items.map(function (r) {

        var ded = (r.deductions || []).reduce(function (x, y) { return x + y.points; }, 0);
        var ai = mode === 'BAND' ? (it.ai_band_index != null && c.bands[it.ai_band_index] ? c.bands[it.ai_band_index].min + '–' + c.bands[it.ai_band_index].max : '–') : (it.ai_proposed_score == null ? '–' : App.num(it.ai_proposed_score));
        var reason = (r.deductions || []).map(function (x) { return esc(x.rule_code) + ' −' + App.num(x.points) + ' ' + esc(x.issue_key); }).join('<br>') + (r.overridden ? '<br>แก้จาก ' + App.num(r.override_from) + ': ' + esc(it.override_reason) : '') + (r.hold_reasons && r.hold_reasons.length ? '<br><span class="t-held">' + esc(r.hold_reasons.join('; ')) + '</span>' : '');
        var ev = r.evidence ? r.evidence.evidence_count + ' ชิ้น' + (r.evidence.sample_required != null ? ' • ตัวอย่าง ' + r.evidence.sample_collected + '/' + r.evidence.sample_required : '') + (r.evidence.complete ? '' : ' <span class="t-warn">ไม่ครบ</span>') : '';
        var incomplete = r.in_scope && r.status !== 'SCORED' && r.status !== 'EXEMPT';
        return '<tr class="' + (incomplete ? 'row-warn' : '') + (r.in_scope ? '' : ' row-out') + '"><td data-label="ข้อ"><strong>' + esc(c.code) + '</strong></td><td data-label="หัวข้อ">' + esc(App.firstLine(App.lang(c.title))) + '</td>' +
          '<td class="num" data-label="คะแนนเต็ม">' + App.num(c.max_points) + '</td><td class="num" data-label="AI เสนอ">' + ai + '</td><td class="num" data-label="คะแนนยืนยัน"><strong>' + (r.score == null ? '–' : App.num(r.score)) + '</strong></td>' +
          '<td class="num" data-label="คะแนนหัก">' + (mode === 'BAND' ? '–' : ded ? '−' + App.num(ded) : '0') + '</td><td data-label="เหตุผล">' + (reason || '–') +
          '<details class="calc-detail"><summary>ดูการคำนวณและหลักฐาน</summary>' + detail(d, r, c, it, rules) + '</details></td><td data-label="หลักฐาน">' + ev + '</td><td data-label="สถานะ">' + App.chip(r.status) + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="hint">คะแนน AI เป็นข้อเสนอ คะแนนยืนยันคำนวณจากกฎในมาตรฐานและผ่านการตรวจทานของผู้ตรวจ</p></section>');

    if (d.findings.length) h.push('<section class="panel"><h2 class="panel-title">ปัญหาจากรอบนี้</h2><ul class="row-list">' + d.findings.map(function (f) { return '<li><a href="#/issue/' + f.id + '"><span class="rl-main"><strong>' + esc(f.issue_no) + '</strong> ' + esc(f.criterion_code) + ' — ' + esc(f.description) + '</span><span class="rl-meta">' + App.chip(f.status) + '</span></a></li>'; }).join('') + '</ul></section>');

    App.$('#main').innerHTML = h.join('');
    App.$$('[data-exp]').forEach(function (b) {
      b.onclick = function () {
        var fn = b.getAttribute('data-exp') === 'pdf' ? 'apiExportAuditPdf' : 'apiExportAuditExcel';
        b.disabled = true; var label = b.innerHTML; b.innerHTML = '<span class="spinner"></span>กำลังสร้างไฟล์…';
        App.api(fn, a.id).then(function (f) { App.download(f); App.toast('ดาวน์โหลด ' + f.file_name, 'ok'); }, App.fail).then(function () { b.disabled = false; b.innerHTML = label; });
      };
    });
    App.$$('[data-jump]').forEach(function (x) { x.onclick = function () { App.store.set('cps_ws_sel_' + a.id, x.getAttribute('data-jump')); }; });
    var bc = App.$('#btn-confirm');
    if (bc) bc.onclick = function () {
      App.confirm('ยืนยันรอบตรวจ ' + a.audit_no, 'คะแนนสุดท้าย ' + App.num(s.final_score) + ' / ' + App.num(s.final_of_max) + (a.scope_mode === 'PARTIAL' ? ' (ตรวจบางส่วน)' : '') + ' — หลังยืนยันจะแก้ไขผลไม่ได้', 'ยืนยันรอบตรวจ').then(function (ok) {
        if (!ok) return;
        bc.disabled = true;
        App.api('apiConfirmAudit', a.id, a.version).then(function (r) { App.toast('ยืนยันรอบตรวจแล้ว • สร้างปัญหา ' + r.findings_created + ' รายการ', 'ok'); App.render(); }, function (e) { bc.disabled = false; App.fail(e); });
      });
    };
    wireRedLine(d);
  }

  function detail(d, r, c, it, rules) {
    var ev = {}; d.evidence.forEach(function (e) { ev[e.id] = e; });
    var h = '<div class="small">';
    if (r.deductions && r.deductions.length) h += '<p><strong>การหักคะแนน</strong></p><ul>' + r.deductions.map(function (x) { var rl = rules[x.rule_id]; return '<li>' + esc(x.rule_code) + ' (' + esc(rl ? (rl.text.th || rl.text.zh) : '') + ') −' + App.num(x.points) + ' • ปัญหา "' + esc(x.issue_key) + '" • หลักฐาน ' + esc((x.evidence_ids || []).map(function (id) { return ev[id] ? ev[id].short_id : id; }).join(', ') || '–') + (x.note ? ' • ' + esc(x.note) : '') + '</li>'; }).join('') + '</ul>';
    if (r.band) h += '<p>ช่วงคะแนน ' + r.band.min + '–' + r.band.max + ' เลือก ' + App.num(r.score) + '</p>';
    var linked = d.links.filter(function (l) { return l.audit_item_id === it.id; }).map(function (l) { return ev[l.evidence_id]; }).filter(Boolean);
    h += '<p><strong>หลักฐานที่เชื่อม</strong> ' + (linked.length ? linked.map(function (e) { return esc(e.short_id + ' ' + (e.kind === 'NOTE' ? 'บันทึก' : e.file_name)); }).join(', ') : '–') + '</p>';
    if (it.auditor_notes) h += '<p><strong>บันทึกผู้ตรวจ</strong> ' + App.nl2br(it.auditor_notes) + '</p>';
    if (it.reviewed_at) h += '<p class="t-muted">ยืนยันผลข้อเมื่อ ' + App.fmtDate(it.reviewed_at, true) + '</p>';
    return h + '</div>';
  }

  // ---------- red lines ----------
  function redLinePanel(d) {
    var s = d.standard.version.settings || {};
    var recs = d.red_lines;
    return '<section class="panel" id="rl-panel"><h2 class="panel-title">' + App.icon('flag') + 'เงื่อนไข Red Line</h2><p class="hint">หักครั้งละ ' + (s.red_line_points == null ? '–' : s.red_line_points) + ' คะแนน • วิธีนับ: ' +
      esc({ ONCE: 'ครั้งเดียวต่อรอบตรวจ', PER_CLAUSE: 'ต่อข้อเงื่อนไขที่พบ', PER_OCCURRENCE: 'ต่อครั้งที่พบ' }[s.red_line_mode] || 'ยังไม่กำหนด (ถ้าพบ Red Line ระบบจะระงับคะแนนสุดท้าย)') + '</p><ul class="rl-list">' +
      d.standard.red_lines.map(function (c) {
        var mine = recs.filter(function (r) { return r.clause_id === c.id && r.status !== 'REJECTED'; });
        return '<li><div><strong>' + esc(c.clause_code) + '</strong> ' + esc(c.text.th || c.text.zh) + '</div>' + mine.map(function (r) {
          return '<div class="rl-rec">' + App.chip(r.status) + ' ' + esc(r.description) + (r.source === 'AI_PROPOSED' ? ' <span class="chip chip-info">AI เสนอ</span>' : '') +
            (d.permissions.edit ? ' <button class="link-btn" data-rl-edit="' + r.id + '">ตรวจสอบ/ยืนยัน</button>' : '') + '</div>';
        }).join('') + (d.permissions.edit ? '<button class="link-btn" data-rl-new="' + c.id + '">' + App.icon('plus') + 'บันทึกว่าพบ</button>' : '') + '</li>';
      }).join('') + '</ul></section>';
  }

  function wireRedLine(d) {
    App.$$('[data-rl-new]').forEach(function (b) { b.onclick = function () { App.redLineDialog(b.getAttribute('data-rl-new')); }; });
    App.$$('[data-rl-edit]').forEach(function (b) { b.onclick = function () { var r = d.red_lines.filter(function (x) { return x.id === b.getAttribute('data-rl-edit'); })[0]; App.redLineDialog(r.clause_id, r); }; });
  }

  /** Dialog to record/confirm/reject a red line. Without args: list all clauses. */
  App.redLineDialog = function (clauseId, rec) {
    var d = App.WS.data;
    if (!clauseId) {
      App.dialog({ title: 'Red Line', body: redLinePanel(d), actions: [{ label: 'ปิด' }], onOpen: function (w) {
        App.$$('[data-rl-new]', w).forEach(function (b) { b.onclick = function () { w.querySelector('[data-x]').click(); App.redLineDialog(b.getAttribute('data-rl-new')); }; });
        App.$$('[data-rl-edit]', w).forEach(function (b) { b.onclick = function () { var r = d.red_lines.filter(function (x) { return x.id === b.getAttribute('data-rl-edit'); })[0]; w.querySelector('[data-x]').click(); App.redLineDialog(r.clause_id, r); }; });
      } });
      return;
    }
    var c = d.standard.red_lines.filter(function (x) { return x.id === clauseId; })[0];
    var sel = {}; ((rec && rec.evidence_ids) || []).forEach(function (id) { sel[id] = true; });
    App.dialog({ title: 'Red Line ' + c.clause_code, body: '<p>' + esc(c.text.th || c.text.zh) + '</p><label class="field"><span>สิ่งที่พบ</span><textarea id="rl-desc" rows="3">' + esc(rec ? rec.description : '') + '</textarea></label>' +
      '<fieldset class="field"><legend>หลักฐาน (จำเป็นเมื่อยืนยัน)</legend><div class="pick-list">' + (d.evidence.length ? d.evidence.map(function (e) { return '<label class="check"><input type="checkbox" value="' + e.id + '"' + (sel[e.id] ? ' checked' : '') + '><span>' + esc(e.short_id + ' ' + (e.kind === 'NOTE' ? String(e.note_text).slice(0, 50) : e.file_name)) + '</span></label>'; }).join('') : '<p class="t-muted">ยังไม่มีหลักฐานในรอบนี้</p>') + '</div></fieldset>',
      actions: [{ label: 'ยกเลิก', value: null }].concat(rec ? [{ label: 'ไม่ใช่ Red Line', value: 'REJECTED' }] : []).concat([{ label: 'ยืนยันว่าพบ Red Line', kind: 'danger', value: 'CONFIRMED' }]),
      onOpen: function (w) { App.WS._rlw = w; } }).then(function (status) {
      if (!status) return;
      var w = App.WS._rlw;
      var data = { id: rec ? rec.id : null, version: rec ? rec.version : null, clause_id: clauseId, status: status, description: w.querySelector('#rl-desc').value, evidence_ids: App.$$('.pick-list input:checked', w).map(function (x) { return x.value; }) };
      App.api('apiSetRedLine', d.audit.id, data).then(function () { App.toast(status === 'CONFIRMED' ? 'บันทึก Red Line แล้ว' : 'บันทึกว่าไม่ใช่ Red Line', 'ok'); App.render(); }, App.fail);
    });
  };
})();

</script>

  <script>

  App.route('/issues', function (q) {

        App.$('#is-list').innerHTML = rows.length ? '<div class="table-wrap"><table class="tbl tbl-cards sortable"><thead><tr><th data-sort="text">Issue ID</th><th data-sort="text">Workshop</th><th data-sort="text">Team/Group</th><th data-sort="text">KUP/หัวข้อ</th><th data-sort="text">ข้อกำหนด</th><th>สิ่งที่พบ</th><th data-sort="text">ผู้รับผิดชอบ</th><th data-sort="text">กำหนดเสร็จ</th><th>สถานะ</th></tr></thead><tbody>' +
          rows.map(function (f) {
            return '<tr><td data-label="Issue ID"><a href="#/issue/' + f.id + '"><strong>' + esc(f.issue_no) + '</strong></a>' + (f.is_red_line ? ' <span class="chip chip-bad">Red Line</span>' : '') + '</td><td data-label="Workshop">' + esc(f.workshop) + '</td><td data-label="Team/Group">' + esc(f.team || f.group || '–') + '</td>' +
              '<td data-label="หัวข้อ">' + esc(f.audit_type === 'KUP' ? f.dimension_code : App.typeLabel[f.audit_type]) + '</td><td data-label="ข้อกำหนด">' + esc(f.criterion_code) + '</td><td data-label="สิ่งที่พบ">' + esc(f.description) + '</td>' +
              '<td data-label="ผู้รับผิดชอบ">' + (f.owner_name ? esc(f.owner_name) : '<span class="t-warn">ยังไม่กำหนด</span>') + '</td><td data-label="กำหนดเสร็จ">' + (f.due_date ? (f.overdue ? '<span class="t-bad">' + esc(f.due_date) + ' (เกินกำหนด)</span>' : esc(f.due_date)) : '<span class="t-warn">ยังไม่กำหนด</span>') + '</td><td data-label="สถานะ">' + App.chip(f.status) + '</td></tr>';
          }).join('') + '</tbody></table></div>' : App.empty('ไม่พบปัญหา', list.length ? 'ลองเปลี่ยนคำค้นหา' : 'ปัญหาจะถูกสร้างเมื่อยืนยันรอบตรวจที่มีข้อไม่สอดคล้อง');
      };
      draw('');
      App.$('#is-search').oninput = App.debounce(function (e) { draw(e.target.value); }, 150);
      App.sortable(App.$('#is-list'));
    }, function (e) { App.$('#is-list').innerHTML = App.errorBox(e, 'App.render()'); });
  });

  App.route('/issue/:id', function (id) {
    App.setTitle('รายละเอียดปัญหา');
    App.$('#main').innerHTML = App.loading();
    App.api('apiGetFinding', id).then(render, function (e) { App.$('#main').innerHTML = App.errorBox(e, 'App.render()'); });
  });

  function evList(list) {
    if (!list.length) return '<p class="t-muted">ไม่มี</p>';
    return '<ul class="ev-list">' + list.map(function (x) { var e = x.evidence; return '<li class="ev"><span class="thumb thumb-ic">' + App.icon(e.kind === 'AUDIO' ? 'mic' : e.kind === 'NOTE' ? 'note' : /PHOTO/.test(e.kind) ? 'camera' : 'file') + '</span><div class="ev-body"><div class="ev-title"><strong>' + esc(e.short_id) + '</strong> ' + esc(e.kind === 'NOTE' ? '' : e.file_name) + '</div>' + (e.kind === 'NOTE' ? '<p class="ev-note">' + App.nl2br(e.note_text) + '</p>' : '<button class="link-btn" data-open="' + e.id + '">' + App.icon('eye') + 'เปิด</button>') + '<div class="ev-meta">' + App.fmtDate(e.captured_at, true) + '</div></div></li>'; }).join('') + '</ul>';
  }

  function render(d) {

    App.setTitle(f.issue_no);
    var src = d.evidence.filter(function (x) { return x.phase === 'SOURCE'; }), after = d.evidence.filter(function (x) { return x.phase === 'AFTER_FIX'; });
    var act = d.actions.slice().sort(function (a, b) { return String(b.submitted_at).localeCompare(String(a.submitted_at)); })[0];

    var idx = steps.map(function (s) { return s[0]; }).indexOf(f.status);
    var h = '<div class="page-head"><div><a class="link-btn" href="#/issues">' + App.icon('chevl') + 'รายการปัญหา</a><h2 class="h-lg">' + esc(f.issue_no) + ' ' + App.chip(f.status) + (f.is_red_line ? ' <span class="chip chip-bad">Red Line</span>' : '') + '</h2>' +
      '<p class="muted">' + esc(f.workshop + (f.group ? ' / ' + f.group : '') + (f.team ? ' / ' + f.team : '')) + ' • รอบตรวจ <a href="#/audit/' + f.audit_id + '/summary">' + esc(f.audit_no) + '</a> • ข้อ ' + esc(f.criterion_code) + '</p></div></div>' +
      '<ol class="progress-steps" aria-label="สถานะการแก้ไข">' + steps.map(function (s, i) { return '<li class="' + (i < idx ? 'done' : i === idx ? 'now' : '') + '"' + (i === idx ? ' aria-current="step"' : '') + '>' + s[1] + '</li>'; }).join('') + '</ol>';
    h += '<div class="two-col"><section class="panel"><h2 class="panel-title">สิ่งที่พบ</h2><p>' + App.nl2br(f.description) + '</p>' +

      '<label class="field"><span>ผู้รับผิดชอบ</span><input name="owner_name" value="' + esc(f.owner_name || '') + '"' + (p.update && f.status !== 'CLOSED' ? '' : ' disabled') + '></label>' +

    h += '<section class="panel"><h2 class="panel-title">การแก้ไข</h2>' + (act ? '<dl class="facts facts-wide"><div><dt>การแก้ไขเฉพาะหน้า</dt><dd>' + App.nl2br(act.containment) + '</dd></div><div><dt>การวิเคราะห์สาเหตุ</dt><dd>' + App.nl2br(act.root_cause) + '</dd></div><div><dt>มาตรการป้องกันเกิดซ้ำ</dt><dd>' + App.nl2br(act.preventive_action) + '</dd></div><div><dt>ส่งเมื่อ</dt><dd>' + App.fmtDate(act.submitted_at, true) + '</dd></div></dl>' : '<p class="t-muted">ยังไม่มีการส่งผลการแก้ไข</p>') +

      '<label class="field"><span>การวิเคราะห์สาเหตุ</span><textarea name="root_cause" rows="2" required>' + esc(act ? act.root_cause : '') + '</textarea></label>' +
      '<label class="field"><span>มาตรการป้องกันเกิดซ้ำ</span><textarea name="preventive_action" rows="2" required>' + esc(act ? act.preventive_action : '') + '</textarea></label>' +
      '<p class="hint">ต้องแนบหลักฐานหลังแก้ไขอย่างน้อย 1 ชิ้นก่อนส่ง</p><button class="btn btn-primary">ส่งผลการแก้ไข (แก้ไขแล้ว รอตรวจยืนยัน)</button></form>';

      (f.status === 'FIXED_PENDING_VERIFY' ? (p.verify ? '<form id="rv-f" class="stack"><label class="field"><span>ความเห็นผู้ตรวจยืนยัน</span><textarea name="comment" rows="2" required></textarea></label><div class="btn-row"><button class="btn btn-primary" value="EFFECTIVE">มีประสิทธิผล — ปิดปัญหา</button><button class="btn btn-ghost" value="NOT_EFFECTIVE">ยังไม่มีประสิทธิผล — ส่งกลับแก้ไข</button></div></form>' : '<p class="hint">ผู้ส่งผลการแก้ไขตรวจยืนยันเองไม่ได้ ต้องเป็นผู้ตรวจคนอื่นหรือ Admin</p>') : '') + '</section>';

    var af = App.$('#af-file');
    if (af) af.onchange = function () {
      var file = af.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function () {
        App.api('apiUploadEvidence', { audit_id: f.audit_id, kind: /^image\//.test(file.type) ? 'OVERVIEW_PHOTO' : 'DOCUMENT', file_name: file.name, mime_type: file.type, base64: String(r.result).split(',')[1], phase: 'AFTER_FIX', finding_id: f.id })
          .then(function () { App.toast('แนบหลักฐานหลังแก้ไขแล้ว', 'ok'); App.render(); }, App.fail);
      };
      r.readAsDataURL(file);

      if ((sum > iw || total > box.h - pad * 2) && s > 14) continue;

        if (ri === 0) { ctx.fillStyle = C.head; ctx.fillRect(x, y, iw, rowH); }
        var differs = ri > 0 && n > 2 && r.slice(1).some(function (o) { return o !== r[1]; });
        r.forEach(function (c, ci) {
          var w = colW(ci), diff = differs && ci > 0;
          if (diff) { ctx.fillStyle = C.badBg; ctx.fillRect(x, y, w, rowH); }
          ctx.font = font(ri === 0 ? s * 0.85 : s, ri === 0 || ci === 0 ? 700 : 800);
          ctx.fillStyle = ri === 0 ? '#fff' : (diff ? C.red : C.ink);
          ctx.textAlign = ci === 0 ? 'left' : 'center';
          var t = c; while (ctx.measureText(t).width > w - 12 && t.length > 1) t = t.slice(0, -1);

    }
  }

  /** Fit images into a region (stacked vertically or in a row); returns placed rects. */
  function placeImages(ctx, region, dir) {
    var imgs = S.images, out = [];
    if (!imgs.length) {
      card(ctx, region.x, region.y, region.w, region.h, null);
      ctx.save(); ctx.setLineDash([14, 10]); ctx.lineWidth = 3; ctx.strokeStyle = '#B9C2D0'; rrect(ctx, region.x + 30, region.y + 30, region.w - 60, region.h - 60, 12); ctx.stroke(); ctx.restore();
      ctx.fillStyle = C.muted; ctx.font = font(36, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('วางภาพหน้าบอร์ดที่นี่', region.x + region.w / 2, region.y + region.h / 2 - 26);
      ctx.font = font(26, 400); ctx.fillText('Ctrl+V · ลากไฟล์มาวาง · ปุ่ม “เลือกภาพ”', region.x + region.w / 2, region.y + region.h / 2 + 26);
      ctx.textAlign = 'left';
      return out;
    }
    var gap = 16, n = imgs.length, pad = 12;
    var cells = imgs.map(function (im, i) {
      var cw = dir === 'row' ? (region.w - gap * (n - 1)) / n : region.w;
      var ch = dir === 'row' ? region.h : (region.h - gap * (n - 1)) / n;
      var cx = dir === 'row' ? region.x + i * (cw + gap) : region.x;
      var cy = dir === 'row' ? region.y : region.y + i * (ch + gap);
      return { x: cx, y: cy, w: cw, h: ch, im: im };
    });
    // vertical stacks: share height by aspect so wide strips don't waste space
    if (dir !== 'row' && n > 1) {
      var labelH = function (im) { return im.label ? 40 : 0; };
      var need = imgs.map(function (im) { return (region.w - pad * 2) * im.h / im.w + labelH(im) + pad * 2; });
      var sum = need.reduce(function (a, b) { return a + b; }, 0), avail = region.h - gap * (n - 1);
      var k = Math.min(1, avail / sum), y = region.y;
      cells = imgs.map(function (im, i) { var h = need[i] * k; var c = { x: region.x, y: y, w: region.w, h: h, im: im }; y += h + gap; return c; });
      var used = y - gap - region.y; if (used < region.h) cells.forEach(function (c) { c.y += (region.h - used) / 2; });
    }
    cells.forEach(function (c) {
      var lh = c.im.label ? 40 : 0;
      var aw = c.w - pad * 2, ah = c.h - pad * 2 - lh;
      var sc = Math.min(aw / c.im.w, ah / c.im.h);
      var w = c.im.w * sc, h = c.im.h * sc;
      var cw = Math.min(c.w, w + pad * 2), ch = h + pad * 2 + lh;
      var cx = dir === 'row' ? c.x + (c.w - cw) / 2 : c.x, cy = c.y + (c.h - ch) / 2;
      card(ctx, cx, cy, cw, ch, null);
      if (lh) { ctx.font = font(26, 700); ctx.fillStyle = C.ink; ctx.textBaseline = 'top'; ctx.fillText(c.im.label, cx + pad, cy + pad); }
      var ix = cx + pad, iy = cy + pad + lh;
      ctx.drawImage(c.im.el, ix, iy, w, h);
      ctx.strokeStyle = '#DDD'; ctx.lineWidth = 1; ctx.strokeRect(ix, iy, w, h);
      out.push({ id: c.im.id, x: ix, y: iy, w: w, h: h, right: cx + cw });
    });
    return out;
  }

  function drawMarks(ctx, rects, extra) {
    var byId = {}; rects.forEach(function (r) { byId[r.id] = r; });
    S.marks.concat(extra ? [extra] : []).forEach(function (m) {
      var b = byId[m.img]; if (!b) return;
      var x = b.x + m.x * b.w, y = b.y + m.y * b.h, w = m.w * b.w, h = m.h * b.h;

  function draw(liveMark) {
    var cv = App.$('#ic-canvas'); if (!cv) return;

    ctx.font = font(30, 800); var tagW = ctx.measureText('ปัญหา').width + 36;

    var title = S.title || (S.section ? S.section + ': ' : '') + 'หัวข้อปัญหา';
    var maxT = W - 64 - tagW - 70, ts = 40;

    ctx.fillStyle = S.title ? '#fff' : 'rgba(255,255,255,.6)';

    var wrong = lines(S.wrong), correct = lines(S.correct), table = parseTable(S.table);
    var cards = [];

    if (wrong.length) cards.push({ kind: 'wrong' });
    if (correct.length) cards.push({ kind: 'correct' });
    if (!cards.length) cards.push({ kind: 'wrong' }, { kind: 'correct' });
    var imgRegion, cardRegion;
    if (S.layout === 'top') {
      var ch = table ? 330 : 300;

      if (c.kind === 'table') tableCard(ctx, box, table);

      else textCard(ctx, box, S.correctLabel || 'ที่ถูกต้อง ✓', correct.length ? correct : ['(พิมพ์สิ่งที่ถูกต้อง)'], C.ok);

  function fileName() {

      function () { App.toast('คัดลอกรูปไม่ได้ในหน้านี้ — ใช้ “ดาวน์โหลด PNG” หรือ “เปิดรูปเต็ม”', 'error'); });
  }

        App.dialog({ title: 'คะแนนเต็มข้อ ' + c.code, body: '<label class="field"><span>คะแนนเต็ม</span><input id="d-pts" type="number" step="0.5" min="0" value="' + (c.max_points == null ? '' : c.max_points) + '" autofocus></label><label class="field"><span>เหตุผล/แหล่งที่ยืนยัน</span><input id="d-why"></label>',
          actions: [{ label: 'ยกเลิก', value: false }, { label: 'บันทึก', kind: 'primary', value: true, onClick: function (w) { App.WS._d = { p: w.querySelector('#d-pts').value, r: w.querySelector('#d-why').value }; if (!App.WS._d.r) { w.querySelector('#d-why').focus(); return false; } } }] })
          .then(function (ok) { if (ok) App.api('apiUpdateDraftCriterion', c.id, { max_points: App.WS._d.p }, c.version, App.WS._d.r).then(reload, App.fail); });
      };
    });
    App.$$('[data-smp]').forEach(function (btn) {
      btn.onclick = function () {
        var c = b.criteria.filter(function (x) { return x.id === btn.getAttribute('data-smp'); })[0], s = c.sample || {};
        App.dialog({ title: 'จำนวนตัวอย่างข้อ ' + c.code, body: (s.text ? '<p class="hint">ข้อความในไฟล์: ' + esc(s.text) + '</p>' : '') + '<div class="form-grid"><label class="field"><span>จำนวน</span><input id="d-n" type="number" min="0" value="' + (s.count || '') + '"></label><label class="field"><span>คิดต่อ</span><select id="d-per"><option value="">ทั้งรอบตรวจ</option><option value="TEAM"' + (s.per === 'TEAM' ? ' selected' : '') + '>ต่อทีมในกลุ่ม</option></select></label><label class="field span-2"><span>หน่วย</span><input id="d-u" value="' + esc(s.unit || '') + '"></label><label class="field span-2"><span>เหตุผล</span><input id="d-why"></label></div><p class="hint">ใส่ 0 หรือเว้นว่างถ้าไม่ต้องนับตัวอย่าง</p>',
          actions: [{ label: 'ยกเลิก', value: false }, { label: 'บันทึก', kind: 'primary', value: true, onClick: function (w) { App.WS._d = { n: w.querySelector('#d-n').value, per: w.querySelector('#d-per').value, u: w.querySelector('#d-u').value, r: w.querySelector('#d-why').value }; if (!App.WS._d.r) { w.querySelector('#d-why').focus(); return false; } } }] })
          .then(function (ok) { if (!ok) return; var d = App.WS._d; App.api('apiUpdateDraftCriterion', c.id, { sample: Number(d.n) > 0 ? { count: Number(d.n), per: d.per || null, unit: d.u } : null }, c.version, d.r).then(reload, App.fail); });
      };
    });
    App.$$('[data-rule]').forEach(function (btn) {
      btn.onclick = function () {
        var r = b.rules.filter(function (x) { return x.id === btn.getAttribute('data-rule'); })[0];
        App.dialog({ title: 'กฎ ' + r.rule_code, body: '<p lang="zh">' + esc(r.text.zh) + '</p><p>' + esc(r.text.th) + '</p><p class="hint">การตีความของระบบ: ' + esc(r.note) + '</p><div class="form-grid"><label class="field"><span>ประเภท</span><select id="d-t">' +
          ['PER_OCCURRENCE', 'ONCE', 'ZERO_SCORE', 'NO_DEDUCTION'].map(function (t) { return '<option value="' + t + '"' + (r.rule_type === t ? ' selected' : '') + '>' + RTYPE[t] + '</option>'; }).join('') + '</select></label><label class="field"><span>คะแนนที่หัก</span><input id="d-p" type="number" step="0.5" value="' + (r.points == null ? '' : r.points) + '"></label><label class="field span-2"><span>เหตุผล</span><input id="d-why"></label></div>',
          actions: [{ label: 'ยกเลิก', value: false }, { label: 'ยืนยันกฎนี้', kind: 'primary', value: true, onClick: function (w) { App.WS._d = { t: w.querySelector('#d-t').value, p: w.querySelector('#d-p').value, r: w.querySelector('#d-why').value }; if (!App.WS._d.r) { w.querySelector('#d-why').focus(); return false; } } }] })
          .then(function (ok) { if (ok) App.api('apiUpdateDraftRule', r.id, { rule_type: App.WS._d.t, points: App.WS._d.p }, r.version, App.WS._d.r).then(reload, App.fail); });
      };
    });
    // route editor
    App.$$('[data-route]').forEach(function (sec) {
      var list = App.$('.route-edit', sec);
      App.$$('[data-up],[data-down]', sec).forEach(function (bt) { bt.onclick = function () { var li = bt.closest('li'); if (bt.hasAttribute('data-up') && li.previousElementSibling) list.insertBefore(li, li.previousElementSibling); else if (bt.hasAttribute('data-down') && li.nextElementSibling) list.insertBefore(li.nextElementSibling, li); bt.focus(); }; });
      var add = App.$('[data-addstop]', sec);
      if (add) add.onclick = function () {
        var li = document.createElement('li');
        li.innerHTML = '<div class="re-head"><input class="re-name" placeholder="ชื่อจุดตรวจ" aria-label="ชื่อจุดตรวจ"><input class="re-time" placeholder="เวลา" aria-label="เวลา"></div><div class="re-crit">' + b.criteria.map(function (c) { return '<label class="chip-check"><input type="checkbox" value="' + c.id + '"><span>' + esc(c.code) + '</span></label>'; }).join('') + '</div><input class="re-instr" placeholder="คำแนะนำ" aria-label="คำแนะนำ">';
        list.appendChild(li); li.querySelector('.re-name').focus();
      };
      var save = App.$('[data-saveroute]', sec);
      if (save) save.onclick = function () {
        var stops = App.$$('li', list).map(function (li) { return { id: li.getAttribute('data-stop') || null, name: li.querySelector('.re-name').value, time_hint: li.querySelector('.re-time').value, instructions: (li.querySelector('.re-instr') || {}).value || '', criterion_ids: App.$$('input[type=checkbox]:checked', li).map(function (x) { return x.value; }), code: 'CUSTOM' }; })
          .filter(function (s) { return s.criterion_ids.length || s.id; });
        App.api('apiSaveRoute', sec.getAttribute('data-route'), stops).then(function () { App.toast('บันทึกเส้นทางแล้ว', 'ok'); reload(); }, App.fail);
      };
    });
  }
})();

</script>

  <script>

    var tabs = [['ai', 'การเชื่อมต่อ AI'], ['users', 'ผู้ใช้และสิทธิ์'], ['master', 'Workshop / Group / Team'], ['log', 'ประวัติการใช้งาน'], ['system', 'ระบบ']];

  function body(h) { App.$('#set-body').innerHTML = h; }

  function ai() {

        '<label class="field"><span>API Key (ใส่เพื่อเปลี่ยน — ระบบไม่แสดงคีย์เดิม)</span><input name="api_key" type="password" autocomplete="off" placeholder="' + (c.connected ? '•••••••• (บันทึกไว้แล้ว)' : 'วาง API Key') + '"></label>' +
        '<div class="span-2 btn-row"><button class="btn btn-primary">บันทึก</button><button type="button" class="btn btn-ghost" id="ai-test"' + (c.connected ? '' : ' disabled') + '>ทดสอบการเชื่อมต่อ</button>' + (c.connected ? '<button type="button" class="btn btn-ghost t-bad" id="ai-clear">ลบ API Key</button>' : '') + '</div></form><div id="ai-res" role="status"></div>' +
        '<div class="notice notice-info"><strong>เรื่องข้อมูลกับ Gemini แบบฟรี</strong><p>ข้อมูลที่ส่งผ่านแพ็กเกจฟรีอาจถูก Google นำไปใช้ปรับปรุงบริการ ควรตรวจกับ IT/ฝ่ายข้อมูลก่อนใช้กับภาพหน้างานจริง เปลี่ยนเป็นแพ็กเกจเสียเงินได้โดยไม่ต้องแก้โค้ด</p>' +
        '<p>API Key ถูกเก็บใน Script Properties ฝั่งเซิร์ฟเวอร์ ไม่อยู่ในหน้าเว็บ ฐานข้อมูล GitHub หรือ log</p></div></section>');
      var f = App.$('#ai-f');
      f.onsubmit = function (ev) { ev.preventDefault(); App.api('apiSetAiConfig', { provider: f.provider.value, model: f.model.value.trim(), tier: f.tier.value, api_key: f.api_key.value.trim() }).then(function (cfg) { App.state.md.ai = cfg; App.renderAiChip(); App.toast('บันทึกการตั้งค่า AI แล้ว', 'ok'); ai(); }, App.fail); };
      var t = App.$('#ai-test');
      t.onclick = function () { t.disabled = true; App.$('#ai-res').innerHTML = App.loading('กำลังเรียก AI…'); App.api('apiTestAi').then(function (r) { App.$('#ai-res').innerHTML = '<p class="notice notice-info">' + App.icon('check') + 'เชื่อมต่อสำเร็จ: ' + esc(r.provider + ' / ' + r.model) + ' ตอบกลับใน ' + r.ms + ' ms</p>'; }, function (e) { App.$('#ai-res').innerHTML = '<p class="notice notice-bad">' + esc(App.errorText(e)) + '</p>'; }).then(function () { t.disabled = false; }); };
      var cl = App.$('#ai-clear');

    }, function (e) { body(App.errorBox(e)); });

  function users() {
    App.api('apiListUsers').then(function (list) {
      var md = App.state.md;
      var wsName = function (ids) { return (ids || []).map(function (id) { if (id === '*') return 'ทุก Workshop'; var w = md.workshops.filter(function (x) { return x.id === id; })[0]; return w ? w.code : '?'; }).join(', ') || '–'; };
      body('<section class="panel"><header class="panel-h"><h2>ผู้ใช้ (' + list.length + ')</h2><button class="btn btn-primary" id="u-new">' + App.icon('plus') + 'เพิ่มผู้ใช้</button></header><div class="table-wrap"><table class="tbl tbl-cards"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>บทบาท</th><th>ขอบเขต Workshop</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
        list.map(function (u) { return '<tr><td data-label="ชื่อผู้ใช้">' + esc(u.username) + '</td><td data-label="ชื่อ">' + esc(u.display_name) + '</td><td data-label="บทบาท">' + esc(u.role_name) + '</td><td data-label="ขอบเขต">' + esc(wsName(u.scope_workshop_ids)) + '</td><td data-label="สถานะ">' + (u.active ? App.chip('CONFIRMED', 'ใช้งาน') : App.chip('CANCELLED', 'ปิดใช้งาน')) + '</td><td><button class="link-btn" data-u="' + u.id + '">แก้ไข</button></td></tr>'; }).join('') +
        '</tbody></table></div><dl class="facts facts-wide small"><div><dt>Admin</dt><dd>จัดการมาตรฐาน ผู้ใช้ ตั้งค่า อนุมัติการยกเว้น</dd></div><div><dt>Auditor</dt><dd>ตรวจ วิเคราะห์ และยืนยันผลใน Workshop ที่ได้รับสิทธิ์ ตรวจยืนยันการแก้ไขของผู้อื่น</dd></div><div><dt>Workshop Owner</dt><dd>ดูผลที่ยืนยันแล้วของหน่วยงาน ส่งการแก้ไขและหลักฐานหลังแก้ไข</dd></div><div><dt>Viewer</dt><dd>ดูรายงานที่ยืนยันแล้วตามขอบเขต ไม่เปิดไฟล์หลักฐาน</dd></div></dl></section>');
      App.$('#u-new').onclick = function () { edit(null); };
      App.$$('[data-u]').forEach(function (b) { b.onclick = function () { edit(list.filter(function (u) { return u.id === b.getAttribute('data-u'); })[0]); }; });
      function edit(u) {
        u = u || { role: 'AUDITOR', scope_workshop_ids: [], active: true };
        var all = u.scope_workshop_ids.indexOf('*') >= 0;
        App.dialog({ title: u.id ? 'แก้ไขผู้ใช้ ' + u.username : 'เพิ่มผู้ใช้', body: '<form id="u-f" class="form-grid"><label class="field"><span>ชื่อผู้ใช้</span><input name="username" value="' + esc(u.username || '') + '" autocapitalize="none"></label><label class="field"><span>ชื่อที่แสดง</span><input name="display_name" value="' + esc(u.display_name || '') + '"></label>' +

          '<label class="check"><input type="checkbox" name="active"' + (u.active ? ' checked' : '') + '><span>ใช้งาน</span></label>' + (u.id ? '<label class="check"><input type="checkbox" name="reset"><span>รีเซ็ตรหัสผ่าน (ออกรหัสชั่วคราวใหม่)</span></label>' : '') + '</form>',
          actions: [{ label: 'ยกเลิก', value: false }, { label: 'บันทึก', kind: 'primary', value: true, onClick: function (w) {

            App.WS._u = { id: u.id, version: u.version, username: f.username.value, display_name: f.display_name.value, email: f.email.value, role: f.role.value, active: f.active.checked, reset_password: f.reset ? f.reset.checked : false,
              scope_workshop_ids: f.all.checked ? ['*'] : App.$$('input[name=ws]:checked', f).map(function (x) { return x.value; }) };

    }, function (e) { body(App.errorBox(e)); });

  function system() {
