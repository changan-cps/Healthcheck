<style>
:root{
  --navy:#0B2A5B; --navy-2:#13386f; --blue:#1F5FBF; --blue-50:#EAF1FB; --ink:#1B2537; --muted:#5A667A; --line:#D5DCE6; --line-2:#E6EBF2;
  --bg:#F3F5F8; --surface:#FFFFFF; --ok:#1E7B4F; --ok-50:#E7F4EC; --warn:#946200; --warn-50:#FFF4D9; --bad:#B42318; --bad-50:#FDECEA;
  --held:#5B3FA0; --held-50:#F0ECFA; --focus:#F2B400; --radius:6px; --radius-lg:10px;
  --font:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-xs:.8125rem; --fs-sm:.875rem; --fs:1rem; --fs-md:1.125rem; --fs-lg:1.375rem; --fs-xl:1.75rem;
  --side:244px; --bar:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 var(--font);font-variant-numeric:tabular-nums;overflow-x:hidden}
a{color:var(--blue)} a:hover{color:var(--navy)}
h1,h2,h3{line-height:1.3;margin:0;font-weight:600}
p{margin:.35rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--navy);color:#fff;padding:.5rem 1rem;border-radius:var(--radius)} .skip:focus{left:8px}
.ic{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:-4px}
.muted,.t-muted{color:var(--muted)} .small{font-size:var(--fs-sm)} .hint{color:var(--muted);font-size:var(--fs-sm);margin:.35rem 0}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)} .t-held{color:var(--held);font-weight:600}
.nodata{color:var(--muted);font-weight:500;font-size:var(--fs-md)}
.src{color:var(--muted);font-size:var(--fs-xs)}
code{background:var(--line-2);padding:.05rem .35rem;border-radius:4px;font-size:.92em}

/* ---------- shell ---------- */
#app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#dfe7f4;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;gap:.65rem;align-items:center;padding:1.1rem 1.1rem 1rem;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;background:#fff;color:var(--navy)} .brand-mark .ic{width:24px;height:24px}
.brand-text{display:flex;flex-direction:column;line-height:1.2} .brand-text strong{color:#fff;font-size:1.05rem} .brand-text small{color:#9fb3d6}
.nav{display:flex;flex-direction:column;padding:.6rem .5rem;gap:2px;flex:1}
.nav-link{display:flex;gap:.7rem;align-items:center;padding:.65rem .8rem;border-radius:var(--radius);color:#dfe7f4;text-decoration:none;border:0;background:none;width:100%;text-align:left;cursor:pointer;min-height:44px}
.nav-link:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-link.active{background:#fff;color:var(--navy);font-weight:600}
.side-foot{padding:.6rem .5rem 1rem;border-top:1px solid rgba(255,255,255,.12)} .who{padding:.4rem .8rem .6rem;display:flex;flex-direction:column} .who strong{color:#fff} .who small{color:#9fb3d6}
.frame{margin-left:var(--side);min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.5rem;background:rgba(243,245,248,.96);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(4px)}
.page-title{font-size:var(--fs-lg);color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.conn{display:inline-flex;gap:.35rem;align-items:center;font-size:var(--fs-sm);padding:.2rem .6rem;border-radius:999px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.conn .ic{width:16px;height:16px} .conn-ok{color:var(--ok)} .conn-warn{color:var(--warn);border-color:#e7c870;background:var(--warn-50)} .conn-bad{color:#fff;background:var(--bad);border-color:var(--bad)}
main{padding:1.25rem 1.5rem 3rem;max-width:1600px;outline:none}
.bottom-nav{display:none}
.sheet{position:fixed;inset:0;background:rgba(11,42,91,.35);z-index:40;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-panel{background:#fff;width:100%;padding:.5rem 0 calc(.75rem + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
.sheet-link{display:flex;gap:.8rem;align-items:center;padding:.9rem 1.25rem;border:0;background:none;width:100%;text-decoration:none;color:var(--ink);font-size:var(--fs-md);min-height:52px;text-align:left}

/* ---------- controls ---------- */
.btn{display:inline-flex;gap:.45rem;align-items:center;justify-content:center;min-height:44px;padding:.5rem 1rem;border-radius:var(--radius);border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff} .btn-primary:hover{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--navy)} .btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-sm{min-height:36px;padding:.3rem .7rem;font-size:var(--fs-sm)}
.btn-block{width:100%}
.link-btn{display:inline-flex;gap:.3rem;align-items:center;background:none;border:0;color:var(--blue);padding:.35rem .25rem;cursor:pointer;font-size:var(--fs-sm);min-height:36px;text-decoration:underline;text-underline-offset:3px}
.link-btn .ic{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);cursor:pointer}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0;margin:0;border:0;padding:0}
.field>span,.field>legend,.field .lbl{font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.field small{color:var(--muted)}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:44px;padding:.5rem .7rem;border:1px solid #b9c3d3;border-radius:var(--radius);background:#fff}
textarea{min-height:auto;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:3px solid rgba(31,95,191,.25);outline-offset:0}
[aria-invalid=true]{border-color:var(--bad)!important}
input[disabled],select[disabled],textarea[readonly],textarea[disabled]{background:var(--line-2);color:var(--muted)}
.field.inline{flex-direction:row;align-items:center}
.check{display:flex;gap:.55rem;align-items:flex-start;min-height:40px;padding:.35rem 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:.15rem;accent-color:var(--blue);flex:none}
.field-error{color:var(--bad);font-weight:600;margin:.25rem 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem 1rem}
.span-2{grid-column:1/-1}
.stack{display:flex;flex-direction:column;gap:.9rem}
.btn-row,.form-actions,.head-actions,.filter-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.form-actions{justify-content:flex-end;margin-top:1rem}
.radio-row{display:flex;gap:.6rem;flex-wrap:wrap}
.radio-card{flex:1 1 200px;display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .85rem;border:1px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;min-height:44px}
.radio-card input{width:20px;height:20px;margin-top:.2rem;accent-color:var(--blue)}
.radio-card span{display:flex;flex-direction:column} .radio-card small{color:var(--muted)}
.radio-card:has(input:checked){border-color:var(--blue);background:var(--blue-50);box-shadow:inset 0 0 0 1px var(--blue)}
.radio-card.disabled{opacity:.55;cursor:not-allowed}
.radio-pill{position:relative;flex:1 1 0}
.radio-pill input{position:absolute;opacity:0;inset:0}
.radio-pill span{display:flex;align-items:center;justify-content:center;min-height:48px;padding:.4rem .6rem;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-weight:600;text-align:center}
.radio-pill input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.r-conform input:checked+span{background:var(--ok-50);border-color:var(--ok);color:var(--ok)}
.r-nonconform input:checked+span{background:var(--bad-50);border-color:var(--bad);color:var(--bad)}
.r-insufficient input:checked+span{background:var(--warn-50);border-color:var(--warn);color:var(--warn)}
fieldset[disabled] .radio-pill span{opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;flex-wrap:wrap}
.seg-btn{border:0;background:none;padding:.45rem .85rem;min-height:40px;text-decoration:none;color:var(--ink);cursor:pointer;font-size:var(--fs-sm);font-weight:500;display:inline-flex;align-items:center}
.seg-btn+.seg-btn{border-left:1px solid var(--line)}
.seg-btn.on{background:var(--navy);color:#fff}
.search{flex:1 1 220px;max-width:420px}
.chip{display:inline-flex;gap:.25rem;align-items:center;font-size:var(--fs-xs);font-weight:600;padding:.1rem .55rem;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.6;vertical-align:middle}
.chip-ic{width:13px;height:13px}
.chip-ok{color:var(--ok);background:var(--ok-50);border-color:#a9d6bb} .chip-bad{color:var(--bad);background:var(--bad-50);border-color:#f2b8b2}
.chip-warn{color:var(--warn);background:var(--warn-50);border-color:#e8c977} .chip-info{color:var(--blue);background:var(--blue-50);border-color:#b7cdee}
.chip-neutral{color:var(--muted);background:#f1f3f7;border-color:var(--line)} .chip-held{color:var(--held);background:var(--held-50);border-color:#cbbdf0}
.chip-check{position:relative;display:inline-flex}
.chip-check input{position:absolute;opacity:0;inset:0}
.chip-check span{display:inline-flex;align-items:center;min-height:36px;padding:.2rem .65rem;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:var(--fs-sm);cursor:pointer}
.chip-check input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip-check input:focus-visible+span{outline:3px solid var(--focus)}
.ev-chips{display:flex;flex-wrap:wrap;gap:.4rem}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.1rem 1.2rem;margin-bottom:1rem;min-width:0}
.panel-title{font-size:var(--fs-md);color:var(--navy);margin-bottom:.6rem;display:flex;gap:.45rem;align-items:center}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;flex-wrap:wrap;margin-bottom:.8rem}
.panel-h h2{font-size:var(--fs-md);color:var(--navy);display:flex;gap:.45rem;align-items:center}
.panel-warn{border-left:4px solid var(--warn)} .panel-ok{border-left:4px solid var(--ok)}
.page-head{display:flex;gap:.75rem 1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem}
.h-lg{font-size:var(--fs-lg);color:var(--navy);margin:.25rem 0}
.notice{display:flex;gap:.5rem;align-items:flex-start;flex-wrap:wrap;padding:.65rem .85rem;border-radius:var(--radius);border:1px solid;margin:.5rem 0;font-size:var(--fs-sm)}
.notice p{margin:.15rem 0;width:100%}
.notice-info{background:var(--blue-50);border-color:#b7cdee;color:#183f7a} .notice-warn{background:var(--warn-50);border-color:#e8c977;color:#6b4800}
.notice-bad{background:var(--bad-50);border-color:#f2b8b2;color:#8a1b12} .notice-held{background:var(--held-50);border-color:#cbbdf0;color:var(--held)}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem;padding:2rem 1rem;color:var(--muted)}
.state strong{color:var(--ink);font-size:var(--fs-md)} .state p{max-width:52ch}
.state-loading{flex-direction:row}
.state-error strong{color:var(--bad)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.plain-list{margin:.3rem 0;padding-left:1.2rem} .plain-list li{margin:.2rem 0}
.row-list{list-style:none;margin:0;padding:0}
.row-list>li{border-top:1px solid var(--line-2)} .row-list>li:first-child{border-top:0}
.row-list a{display:flex;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;padding:.7rem .25rem;text-decoration:none;color:var(--ink);min-height:44px}
.row-list a:hover{background:var(--blue-50)}
.rl-meta{color:var(--muted);font-size:var(--fs-sm);display:flex;gap:.4rem;align-items:center}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem 1rem;margin:.5rem 0 1rem}
.facts dt{font-size:var(--fs-xs);color:var(--muted)} .facts dd{margin:0;font-weight:600}
.facts-wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))} .facts-wide dd{font-weight:400}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-2);border-radius:var(--radius)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th,.tbl td{padding:.55rem .7rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
.tbl th{background:#f6f8fb;color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0}
.tbl th[data-sort]{cursor:pointer} .tbl th[aria-sort=ascending]::after{content:" ▲"} .tbl th[aria-sort=descending]::after{content:" ▼"}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tbody tr:hover{background:#fafbfd}
.row-warn{background:#fffbef} .row-out{opacity:.55}
.chart-table{margin-top:.4rem;font-size:var(--fs-sm)} .chart-table summary{cursor:pointer;color:var(--blue)}

/* ---------- dashboard ---------- */
.filters{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:1rem}
.filters>summary{cursor:pointer;padding:.7rem 1rem;font-weight:600;color:var(--navy);display:flex;gap:.4rem;align-items:center;min-height:44px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.75rem;padding:0 1rem 1rem;align-items:end}
.kpi-strip{display:flex;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:1rem;overflow:hidden;flex-wrap:wrap}
.kpi{flex:1 1 140px;display:flex;flex-direction:column;gap:.1rem;padding:.9rem 1.1rem;text-decoration:none;color:var(--ink);border-right:1px solid var(--line-2);min-height:44px}
.kpi:last-child{border-right:0}
a.kpi:hover{background:var(--blue-50)}
.kpi-wide{flex:2 1 260px;background:#f8fafd}
.kpi-label{font-size:var(--fs-sm);color:var(--muted)}
.kpi-value{font-size:var(--fs-xl);font-weight:700;color:var(--navy);line-height:1.15}
.kpi-note{font-size:var(--fs-xs);color:var(--muted)}
.kpi-warn .kpi-value{color:var(--warn)} .kpi-bad .kpi-value{color:var(--bad)}
.kpi-issues{border-top:3px solid var(--line)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.dash-grid .panel{margin:0}
.dash-grid .span-2{grid-column:1/-1}
.hbars{display:flex;flex-direction:column;gap:.45rem}
.hb-row{display:grid;grid-template-columns:56px 1fr auto;gap:.6rem;align-items:center;text-decoration:none;color:var(--ink);min-height:36px}
.hb-label{font-weight:600}
.hb-track{height:14px;background:var(--line-2);border-radius:3px;overflow:hidden}
.hb-fill{display:block;height:100%;background:var(--blue)} .hb-ok{background:var(--ok)} .hb-warn{background:#c98a00} .hb-bad{background:var(--bad)}
.hb-val{text-align:right;font-weight:600;display:flex;flex-direction:column;line-height:1.2} .hb-val small{color:var(--muted);font-weight:400}
.chart{margin:0} .chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line-2)} .chart .tick{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .line{fill:none;stroke:var(--blue);stroke-width:2.5} .chart .dot{fill:#fff;stroke:var(--blue);stroke-width:2.5}
.chart .bar{fill:var(--navy)} .chart a:hover .bar{fill:var(--blue)} .chart .line2{fill:none;stroke:#c98a00;stroke-width:2} .chart .dot2{fill:#c98a00}
.rl-main{flex:1 1 300px}

/* ---------- audit workspace ---------- */
.ws-head{display:grid;grid-template-columns:1fr auto auto;gap:.75rem 1.25rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:.8rem 1rem;margin-bottom:.8rem}
.wh-title{font-size:var(--fs-md);display:flex;gap:.4rem;align-items:center;flex-wrap:wrap} .wh-title strong{color:var(--navy)}
.wh-meta{color:var(--muted);font-size:var(--fs-sm)}
.wh-score{display:flex;flex-direction:column;gap:.15rem;font-size:var(--fs-sm);min-width:200px}
.wh-num{font-weight:700;color:var(--navy)}
.meter{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden} .meter span{display:block;height:100%;background:var(--ok)}
.wh-actions{display:flex;gap:.5rem;flex-wrap:wrap}

/* route: the production-line track */
.route{background:var(--navy);color:#fff;border-radius:var(--radius-lg);padding:.8rem 1rem 1rem;margin-bottom:.8rem}
.route-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.route-head h2{font-size:var(--fs);font-weight:600;display:flex;gap:.45rem;align-items:center}
.route .seg{background:transparent;border-color:rgba(255,255,255,.35)} .route .seg-btn{color:#dfe7f4} .route .seg-btn+.seg-btn{border-color:rgba(255,255,255,.35)} .route .seg-btn.on{background:#fff;color:var(--navy)}
.track{list-style:none;margin:0;padding:0;display:flex;gap:0;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.station{position:relative;flex:1 0 150px;scroll-snap-align:start}
.station::before{content:"";position:absolute;top:21px;left:0;right:0;height:4px;background:rgba(255,255,255,.25)}
.station:first-child::before{left:50%} .station:last-child::before{right:50%}
.station.st-done::before,.station.st-partial::before{background:linear-gradient(90deg,#6fcf97 50%,rgba(255,255,255,.25) 50%)}
.station.st-done::before{background:#6fcf97}
.station button{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;width:100%;background:none;border:0;color:#fff;cursor:pointer;padding:.25rem .4rem .35rem;text-align:center;min-height:44px;border-radius:8px}
.station button:hover{background:rgba(255,255,255,.08)}
.st-node{display:grid;place-items:center;width:30px;height:30px;margin-top:8px;border-radius:50%;background:var(--navy);border:3px solid rgba(255,255,255,.55)}
.st-node .ic{width:16px;height:16px}
.st-done .st-node{background:#6fcf97;border-color:#6fcf97;color:var(--navy)}
.st-partial .st-node{border-color:#6fcf97}
.st-active .st-node{background:#F2B400;border-color:#F2B400}
.station.sel button{background:#fff;color:var(--navy)} .station.sel .st-meta{color:var(--muted)}
.st-name{font-weight:600;font-size:var(--fs-sm);line-height:1.25}
.st-meta{font-size:var(--fs-xs);color:#b9c8e3}
.stop-bar{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;align-items:flex-start;background:#fff;color:var(--ink);border-radius:var(--radius);padding:.7rem .9rem;margin-top:.75rem}

.ws-picker,.ws-steps{display:none}
.ws-grid{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr) minmax(320px,400px);grid-template-areas:"list ev ai" "std ev score";grid-template-rows:auto 1fr;gap:.8rem;align-items:start}
.ws-list{grid-area:list;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);max-height:46vh;overflow:auto}
.ws-std{grid-area:std} .ws-ev{grid-area:ev} .ws-ai{grid-area:ai} .ws-score{grid-area:score}
.ws-pane{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:1rem;min-width:0}
.ws-ev{grid-row:1/3} .ws-std{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.list-head{display:flex;justify-content:space-between;padding:.55rem .8rem;font-size:var(--fs-sm);border-bottom:1px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:1}
.crit-dim h3{font-size:var(--fs-xs);color:var(--muted);font-weight:600;padding:.55rem .8rem .25rem;background:#f8fafc}
.crit-dim h3 small{font-weight:400}
.crit-dim ul{list-style:none;margin:0;padding:0}
.crit-link{display:grid;grid-template-columns:22px minmax(44px,max-content) 1fr auto auto;gap:.45rem;align-items:center;width:100%;text-align:left;padding:.5rem .8rem;border:0;border-left:3px solid transparent;background:none;cursor:pointer;min-height:44px;font-size:var(--fs-sm);position:relative}
.crit-link:hover{background:var(--blue-50)}
.crit-link.on{background:var(--blue-50);border-left-color:var(--blue);font-weight:600}
.cl-code{color:var(--navy);font-weight:700;font-size:var(--fs-xs)} .cl-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .cl-pts{color:var(--muted);font-size:var(--fs-xs)}
.cl-dirty{position:absolute;right:4px;top:2px;color:var(--warn);font-size:10px}
.li-st{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px}
.li-st .ic{width:14px;height:14px}
.li-ok{background:var(--ok);color:#fff} .li-warn{background:var(--warn-50);color:var(--warn);border:1px solid #e8c977} .li-held{background:var(--held-50);color:var(--held)} .li-todo{border:2px solid #b9c3d3} .li-neutral{background:#eef1f5;color:var(--muted)}
.pane-h{display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:.6rem}
.pane-h h2{font-size:var(--fs-md);color:var(--navy);display:flex;gap:.4rem;align-items:center}
.code-badge{background:var(--navy);color:#fff;font-weight:700;font-size:var(--fs-sm);padding:.15rem .5rem;border-radius:4px}
.ws-std .pane-h{justify-content:flex-start}
.sub{font-size:var(--fs-sm);color:var(--navy);margin:.9rem 0 .35rem;font-weight:700}
.lang{font-size:var(--fs-sm);line-height:1.6}
.lang-alt{font-size:var(--fs-sm);color:var(--muted);margin:.3rem 0} .lang-alt summary{cursor:pointer;color:var(--blue)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:.1rem .5rem;padding:.5rem .6rem;border:1px solid var(--line-2);border-radius:var(--radius);font-size:var(--fs-sm)}
.rule-code{font-weight:700;color:var(--navy);font-size:var(--fs-xs)} .rule-type{font-weight:600;color:var(--bad);font-size:var(--fs-xs)} .rule-text{grid-column:1/-1}
.bands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.band{display:grid;grid-template-columns:52px 1fr auto;gap:.5rem;padding:.5rem .6rem;border:1px solid var(--line-2);border-radius:var(--radius);font-size:var(--fs-sm);align-items:start}
.band-r{font-weight:700;color:var(--navy)} .band-ai{border-color:#b7cdee;background:var(--blue-50)} .band-sel{box-shadow:inset 4px 0 0 var(--navy)}
.flags{margin-top:.8rem;font-size:var(--fs-sm)} .flags summary{cursor:pointer;color:var(--warn);display:flex;gap:.3rem;align-items:center}
.ws-std .src{margin-top:.8rem}

.sample{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.5rem .75rem;border-radius:var(--radius);margin-bottom:.7rem;font-size:var(--fs-sm)}
.sample-ok{background:var(--ok-50);color:var(--ok)} .sample-short{background:var(--warn-50);color:#6b4800}
.capture{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.5rem;margin-bottom:.6rem}
.cap-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;min-height:72px;padding:.5rem .25rem;border:1px solid var(--line);background:#f8fafd;border-radius:var(--radius);cursor:pointer;color:var(--navy);font-weight:600;font-size:var(--fs-sm);text-align:center}
.cap-btn .ic{width:26px;height:26px}
.cap-btn:hover{border-color:var(--blue);background:var(--blue-50)}
.ev-meta-row{display:grid;grid-template-columns:1fr 140px;gap:.6rem;margin-bottom:.6rem}
.dropzone{border:2px dashed #b9c3d3;border-radius:var(--radius);padding:.7rem;text-align:center;color:var(--muted);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:.25rem;justify-content:center;align-items:center}
.dropzone small{width:100%} .dropzone.over{border-color:var(--blue);background:var(--blue-50)}
.up-list{display:flex;flex-direction:column;gap:.35rem;margin:.5rem 0}
.up{display:flex;gap:.5rem;align-items:center;padding:.45rem .6rem;border-radius:var(--radius);background:var(--blue-50);font-size:var(--fs-sm)}
.up-wait{background:var(--warn-50)} .up-bad{background:var(--bad-50)}
.ev-list{list-style:none;margin:.6rem 0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.ev{display:grid;grid-template-columns:72px 1fr;gap:.7rem;padding:.55rem;border:1px solid var(--line-2);border-radius:var(--radius)}
.ev-empty{border:0}
.thumb{width:72px;height:72px;border-radius:4px;overflow:hidden;background:var(--line-2);border:0;padding:0;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-ic{cursor:default} .thumb-ic .ic{width:28px;height:28px}
.ev-body{min-width:0}
.ev-title{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm)}
.ev-id{font-size:var(--fs-xs);color:var(--muted);background:#f1f3f7;padding:0 .35rem;border-radius:3px}
.ev-meta{font-size:var(--fs-xs);color:var(--muted);overflow-wrap:anywhere}
.ev-note{font-size:var(--fs-sm);margin:.25rem 0;white-space:normal}
.ev-actions{display:flex;gap:.25rem;flex-wrap:wrap}
.audio{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.35rem 0} .audio audio{width:100%}
.transcript{border-left:3px solid var(--line);padding-left:.6rem;margin:.4rem 0;font-size:var(--fs-sm)}
.transcript ol{list-style:none;margin:.3rem 0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.transcript li{display:grid;grid-template-columns:auto 1fr;gap:.4rem;align-items:start}
.tr-head{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.ts{border:1px solid var(--line);background:#fff;border-radius:4px;font-size:var(--fs-xs);padding:.15rem .35rem;cursor:pointer;color:var(--blue);min-height:28px}
.tr-text{padding:.1rem .25rem;border-radius:3px} .tr-text:focus{background:var(--warn-50);outline:2px solid var(--focus)}
.transcript-empty{display:flex;gap:.4rem;flex-wrap:wrap;margin:.35rem 0}
.notes{margin-top:.8rem}
.ai-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.ai-result{border-top:1px solid var(--line-2);padding-top:.6rem}
.ai-verdict{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.4rem}
.ai-score{font-size:var(--fs-sm)} .ai-score strong{font-size:var(--fs-md);color:var(--navy)}
.obs{margin:.2rem 0;padding-left:1.1rem;font-size:var(--fs-sm)} .obs li{margin:.3rem 0}
.obs-fact{color:var(--ok)} .obs-statement{color:var(--blue)} .obs-assumption{color:var(--warn)}
.refs{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.15rem}
.ref{font-size:var(--fs-xs);border:1px solid #b7cdee;background:var(--blue-50);color:var(--navy);border-radius:4px;padding:.1rem .4rem;cursor:pointer;min-height:26px}
.checklist{margin:.2rem 0;padding-left:1.1rem;font-size:var(--fs-sm)}
.rationale{font-size:var(--fs-sm);margin:.5rem 0} .rationale summary{cursor:pointer;color:var(--blue)}
.issues{border:1px solid var(--line-2);border-radius:var(--radius);padding:.6rem;margin:.7rem 0;display:flex;flex-direction:column;gap:.6rem}
.issues-h{display:flex;flex-direction:column}
.issue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;padding:.6rem;border-radius:var(--radius);background:#f8fafd;border:1px solid var(--line-2)}
.issue>.chip,.issue>.link-btn{justify-self:start}
.calc{border:1px solid var(--line-2);border-radius:var(--radius);padding:.5rem .7rem;margin:.6rem 0;font-size:var(--fs-sm)}
.calc-row{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0}
.calc-row.total{border-top:1px solid var(--line);margin-top:.2rem;padding-top:.4rem;font-size:var(--fs)}
.override{font-size:var(--fs-sm);margin:.5rem 0} .override summary{cursor:pointer;color:var(--blue);min-height:36px;display:flex;align-items:center}
.override .form-grid{margin-top:.5rem}
.score-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.8rem}
.radio-row.tight{gap:.4rem;flex-wrap:nowrap}
.actionbar{display:none}
.save-state{display:inline-flex;gap:.35rem;align-items:center;font-size:var(--fs-sm)}
.s-ok{color:var(--ok)} .s-info{color:var(--blue)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
.ws .actionbar{display:flex;position:sticky;bottom:0;z-index:15;gap:.5rem;align-items:center;justify-content:flex-end;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:.5rem .75rem;margin-top:.8rem}
.ws .actionbar .save-state{margin-right:auto}
.only-mobile{display:none}

/* quick capture, tray, history */
.hist{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--radius);padding:.55rem .8rem;margin-bottom:.8rem;font-size:var(--fs-sm)}
.hist-none{border-left-color:var(--line);color:var(--muted)}
.prev-box{background:var(--bad-50);border:1px solid #f2b8b2;border-radius:var(--radius);padding:.4rem .7rem;margin:.2rem 0 .6rem}
.prev-box .sub{margin-top:.2rem;color:var(--bad);display:flex;gap:.3rem;align-items:center}
.cl-prev{font-size:10px;font-weight:700;color:var(--bad);background:var(--bad-50);border:1px solid #f2b8b2;border-radius:999px;padding:0 .4rem;white-space:nowrap}
.mini-select{width:auto!important;min-height:32px!important;padding:.1rem .4rem!important;font-size:var(--fs-xs)}
.list-head{align-items:center;gap:.5rem}
.list-hint{padding:0 .8rem}
.flat{list-style:none;margin:0;padding:0}
.tray{background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius-lg);padding:.5rem .9rem;margin-bottom:.8rem}
.tray>summary{cursor:pointer;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;min-height:44px}
.tray .btn-row{margin:.3rem 0 .5rem}
.tray-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.6rem}
.tray-list li{display:grid;grid-template-columns:72px 1fr;gap:.6rem;padding:.5rem;border:1px solid var(--line-2);border-radius:var(--radius)}
.tray-body{min-width:0;font-size:var(--fs-sm)}
.tray-assign{display:flex;gap:.4rem;margin-top:.35rem} .tray-assign select{flex:1;min-width:0}
.qc-shot{margin-bottom:.6rem}
#qc-prev{max-width:100%;max-height:220px;display:block;margin:0 auto .6rem;border-radius:var(--radius)}

/* summary */
.score-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:1rem;overflow:hidden}
.sh-block{display:flex;flex-direction:column;gap:.15rem;padding:1rem 1.2rem;border-right:1px solid var(--line-2)}
.sh-block:first-child{background:var(--navy);color:#fff} .sh-block:first-child .sh-label{color:#b9c8e3} .sh-block:first-child .sh-value{color:#fff} .sh-block:first-child .nodata{color:#b9c8e3}
.sh-label{font-size:var(--fs-sm);color:var(--muted)} .sh-value{font-size:2.25rem;font-weight:700;line-height:1.1;color:var(--navy)} .sh-value small{font-size:var(--fs);font-weight:500}
.sh-sub{font-size:var(--fs-xl)}
.blockers{margin:.3rem 0;padding-left:1.2rem;font-size:var(--fs-sm)} .blockers li{margin:.25rem 0}
.calc-detail{margin-top:.3rem} .calc-detail summary{cursor:pointer;color:var(--blue);font-size:var(--fs-xs)}
.rl-list{list-style:none;margin:0;padding:0} .rl-list>li{padding:.6rem 0;border-top:1px solid var(--line-2);font-size:var(--fs-sm)} .rl-rec{margin:.3rem 0 0 .5rem}
.pick-list{display:flex;flex-direction:column;max-height:44vh;overflow:auto;border:1px solid var(--line-2);border-radius:var(--radius);padding:.2rem .6rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.8rem} .cmp h3{font-size:var(--fs-sm)}

/* issues */
.progress-steps{list-style:none;display:flex;margin:0 0 1rem;padding:0;counter-reset:s;flex-wrap:wrap;gap:.25rem}
.progress-steps li{flex:1 1 140px;padding:.5rem .7rem;background:#fff;border:1px solid var(--line);font-size:var(--fs-sm);color:var(--muted);border-radius:var(--radius)}
.progress-steps li.done{color:var(--ok);border-color:#a9d6bb;background:var(--ok-50)} .progress-steps li.now{color:#fff;background:var(--navy);border-color:var(--navy);font-weight:600}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem} .two-col .panel{margin:0}
.timeline{list-style:none;padding:0;margin:0;font-size:var(--fs-sm)} .timeline li{padding:.3rem 0;border-left:2px solid var(--line);padding-left:.7rem}
.ca-form{margin-top:1rem;border-top:1px solid var(--line-2);padding-top:1rem}

/* standards */
.flag-list{list-style:none;margin:.3rem 0;padding:0;font-size:var(--fs-sm)} .flag-list li{padding:.35rem .5rem;border-left:3px solid var(--warn);margin:.25rem 0;background:#fffcf3}
.flag-list li.sev-block{border-color:var(--bad);background:var(--bad-50)}
.cand>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:.4rem}
.decisions{display:flex;flex-direction:column;gap:.8rem}
.decision{border:1px solid var(--line-2);border-radius:var(--radius);padding:.6rem .8rem;margin:0}
.decision legend{font-weight:600;font-size:var(--fs-sm);padding:0 .25rem}
.rule-line{margin:.15rem 0}
.route-edit{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:.7rem}
.route-edit li{padding:.6rem;border:1px solid var(--line-2);border-radius:var(--radius)}
.re-head{display:grid;grid-template-columns:1fr 110px auto auto;gap:.4rem;margin-bottom:.4rem}
.re-crit{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tab{padding:.6rem .9rem;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.tab.on{color:var(--navy);border-color:var(--navy);font-weight:600}
.big-code{font-size:1.6rem;font-weight:700;letter-spacing:.05em;color:var(--navy);background:var(--blue-50);padding:.5rem 1rem;border-radius:var(--radius);display:inline-block}
.ms-head{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.5rem 0}
.ms-groups{list-style:none;margin:0 0 .5rem 1rem;padding:0;display:flex;flex-direction:column;gap:.4rem;font-size:var(--fs-sm)}
.crit-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.6rem}
.crit-group{border:1px solid var(--line-2);border-radius:var(--radius);padding:.4rem .7rem;margin:0}
.crit-group legend{font-weight:600;font-size:var(--fs-sm)}
.form-page .panel{max-width:1000px}

/* modal & toasts */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,42,91,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:1rem}
.modal{background:#fff;border-radius:var(--radius-lg);width:min(640px,100%);max-height:calc(100vh - 2rem);display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line-2)}
.modal-head h2{font-size:var(--fs-md);color:var(--navy)}
.modal-head .icon-btn{border:0}
.modal-body{padding:1rem;overflow:auto}
.modal-foot{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;padding:.75rem 1rem;border-top:1px solid var(--line-2)}
.viewer img,.viewer video{max-width:100%;height:auto;display:block;margin:0 auto}
.viewer object{width:100%;height:60vh}
.rec{text-align:center}
.rec-time{font-size:2.5rem;font-weight:700;color:var(--navy);margin:.5rem 0}
.rec-btns{display:flex;justify-content:center;gap:.6rem;margin:.6rem 0}
.rec audio{width:100%;margin-top:.6rem}
#toasts{position:fixed;right:1rem;bottom:5.5rem;display:flex;flex-direction:column;gap:.5rem;z-index:80;max-width:min(420px,calc(100vw - 2rem))}
.toast{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between;padding:.65rem .8rem;border-radius:var(--radius);background:var(--navy);color:#fff;font-size:var(--fs-sm)}
.toast-ok{background:var(--ok)} .toast-error{background:var(--bad)} .toast-warn{background:#7a5200}
.toast-x{background:none;border:0;color:inherit;cursor:pointer;min-width:32px;min-height:32px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(180deg,var(--navy) 0 38%,var(--bg) 38%)}
.login-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.6rem;width:min(420px,100%)}
.login-brand{display:flex;gap:.7rem;align-items:center;margin-bottom:1.2rem} .login-brand .brand-mark{background:var(--navy);color:#fff} .login-brand div{display:flex;flex-direction:column} .login-brand strong{color:var(--navy);font-size:var(--fs-md)} .login-brand small{color:var(--muted)}
.login-h{font-size:var(--fs-lg);color:var(--navy)}

/* ---------- tablet (768–1199) ---------- */
@media (max-width:1199px){
  .ws-grid{grid-template-columns:minmax(260px,320px) minmax(0,1fr);grid-template-areas:"list main" "std main";}
  .ws-ev,.ws-ai,.ws-score{grid-area:main;grid-row:1/3}
  .ws .ws-steps{display:flex}
  .ws[data-step=std] .ws-ev,.ws[data-step=ev] .ws-ev{display:block}
  .ws:not([data-step=ev]):not([data-step=std]) .ws-ev{display:none}
  .ws[data-step=std] .ws-ai,.ws[data-step=ev] .ws-ai,.ws[data-step=score] .ws-ai{display:none}
  .ws[data-step=std] .ws-score,.ws[data-step=ev] .ws-score,.ws[data-step=ai] .ws-score{display:none}
  .ws-steps{gap:.25rem;margin-bottom:.6rem;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:.3rem}
  .ws-steps .step[data-step-btn=std]{display:none}
  .step{flex:1;display:flex;gap:.4rem;align-items:center;justify-content:center;min-height:44px;border:0;background:none;border-radius:var(--radius);cursor:pointer;font-weight:600;color:var(--muted)}
  .step.on{background:var(--navy);color:#fff}
  .ws[data-step=std] .step[data-step-btn=ev]{background:var(--navy);color:#fff}
  .step-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:var(--fs-xs)}
  .ws-head{grid-template-columns:1fr auto}
  .wh-actions{grid-column:1/-1}
  .dash-grid{grid-template-columns:1fr}
}
/* ---------- tablet shell (768–1023): icon rail with labels ---------- */
@media (max-width:1023px) and (min-width:768px){
  :root{--side:92px}
  .brand-text,.who{display:none} .brand{justify-content:center;padding:.9rem .5rem}
  .nav-link{flex-direction:column;gap:.2rem;font-size:var(--fs-xs);padding:.55rem .25rem;text-align:center;justify-content:center}
  .nav-link span{line-height:1.2}
}
/* ---------- mobile (<768) ---------- */
@media (max-width:767px){
  body{font-size:1rem}
  .sidebar{display:none} .frame{margin-left:0}
  .topbar{padding:.55rem 1rem} .page-title{font-size:var(--fs-md)}
  #ai-chip .chip{font-size:0;padding:.25rem} #ai-chip .chip .ic{width:16px;height:16px;margin:0}
  main{padding:.9rem 1rem calc(var(--bar) + 1.5rem + env(safe-area-inset-bottom))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bn-link{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:var(--bar);font-size:var(--fs-xs);color:var(--muted);text-decoration:none;border:0;background:none;cursor:pointer}
  .bn-link.active{color:var(--navy);font-weight:700} .bn-link.active .ic{color:var(--blue)}
  .form-grid,.two-col,.cmp{grid-template-columns:1fr}
  .kpi{flex:1 1 45%;border-bottom:1px solid var(--line-2)} .kpi-value{font-size:var(--fs-lg)} .kpi-wide{flex:1 1 100%}
  .page-head{align-items:stretch} .page-head>.btn,.page-head>label.btn{width:100%} .search{max-width:none}
  .seg{width:100%} .seg-btn{flex:1 1 auto;justify-content:center}
  /* tables → cards */
  .tbl-cards thead{display:none}
  .tbl-cards,.tbl-cards tbody,.tbl-cards tr,.tbl-cards td{display:block;width:100%}
  .tbl-cards tr{border:1px solid var(--line);border-radius:var(--radius);margin:.5rem 0;padding:.4rem .6rem;background:#fff}
  .tbl-cards td{border:0;padding:.2rem 0;display:flex;gap:.6rem;justify-content:space-between;text-align:right}
